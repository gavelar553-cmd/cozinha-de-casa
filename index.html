n virando na metade, sem sobrepor."],"busca":"beterraba em rodelas com alecrim 3 beterrabas medias em rodelas de ~0,5 cm 2 col. (sopa) de azeite 1 col. (cha) de alecrim fresco sal pimenta 4 porcoes. pre-aquece 180 °c 5 min, assa 15 a 20 min virando na metade, sem sobrepor. "},{"id":"13-R2-27","nome":"Cogumelos assados com tomilho","cat":["Air fryer","Legumes e sopa"],"fonte":"Receitinhas Caseiras","url":"https://receitinhascaseiras.com.br/10-receitas-saudaveis-na-air-fryer/","tempo":"~12 min","min":12,"dif":1,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["200 g de cogumelos frescos","1 col. (chá) de azeite","Sal","Pimenta","Tomilho"],"prep":["Limpar, cortar ao meio se forem grandes, 180 °C 8 min."],"busca":"cogumelos assados com tomilho 200 g de cogumelos frescos 1 col. (cha) de azeite sal pimenta tomilho limpar, cortar ao meio se forem grandes, 180 °c 8 min. "},{"id":"13-R2-28","nome":"Chuchu assado com cominho e canela","cat":["Air fryer","Legumes e sopa"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/chuchu-assado-com-especiarias-na-air-fryer","tempo":"~30 min","min":30,"dif":2,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["2 chuchus","1 dente de alho","1 col. (chá) de cominho em pó","½ col. (chá) de canela","½ col. (chá) de sal","2 col. (sopa) de azeite"],"prep":["Até 4 porções.","Alho amassado com sal em pasta, junta cominho, canela e azeite. Chuchu sem semente em pedaços de 2 cm. Pré-aquece 200 °C, assa ~20 min sem virar."],"busca":"chuchu assado com cominho e canela 2 chuchus 1 dente de alho 1 col. (cha) de cominho em po ½ col. (cha) de canela ½ col. (cha) de sal 2 col. (sopa) de azeite ate 4 porcoes. alho amassado com sal em pasta, junta cominho, canela e azeite. chuchu sem semente em pedacos de 2 cm. pre-aquece 200 °c, assa ~20 min sem virar. "},{"id":"13-R2-29","nome":"Batatas laminadas em flor","cat":["Air fryer","Legumes e sopa"],"fonte":"Arno","url":"https://www.minhaarno.com.br/post/receita-air-fry-batatas-laminadas/","tempo":"50 min","min":50,"dif":2,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["3 batatas descascadas em fatias finas","Sal","Manteiga derretida"],"prep":["Fatias lado a lado em forma redonda, em flor, pinceladas com manteiga. Air fryer aquecida a 160 a 170 °C por 30 min ou até dourar. 4 a 5 porções, 50 min."],"busca":"batatas laminadas em flor 3 batatas descascadas em fatias finas sal manteiga derretida fatias lado a lado em forma redonda, em flor, pinceladas com manteiga. air fryer aquecida a 160 a 170 °c por 30 min ou ate dourar. 4 a 5 porcoes, 50 min. "},{"id":"13-R2-30","nome":"Crispy de alho-poró","cat":["Air fryer","Legumes e sopa"],"fonte":"Arno","url":"https://www.minhaarno.com.br/post/receita-airfry-crispy-de-alho-poro/","tempo":"20 min","min":20,"dif":1,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["1 talo de alho-poró em tiras finas","2 col. (sopa) de azeite","Sal","1½ col. (sopa) de amido de milho"],"prep":["140 °C 10 a 15 min, mexendo de tempos em tempos. Esfriar no papel-toalha. 2 porções, 20 min."],"busca":"crispy de alho-poro 1 talo de alho-poro em tiras finas 2 col. (sopa) de azeite sal 1½ col. (sopa) de amido de milho 140 °c 10 a 15 min, mexendo de tempos em tempos. esfriar no papel-toalha. 2 porcoes, 20 min. "},{"id":"13-R2-31","nome":"Coxinha fit de batata-doce","cat":["Air fryer","Lanche"],"fonte":"Receitas com Air Fryer","url":"https://receitascomairfryer.com.br/receitinhas-fit-na-airfryer-pratos-saudaveis-que-voce-precisa-experimentar/","tempo":"~50 min","min":50,"dif":3,"sal":"baixo","eq":["af"],"prot":["Frango"],"ing":["300 g de batata-doce cozida e amassada","200 g de frango cozido desfiado e temperado","2 col. (sopa) de farinha de arroz","Sal","Temperos","Farinha de aveia pra empanar"],"prep":["6 unidades.","180 °C 20 min, virando na metade."],"busca":"coxinha fit de batata-doce 300 g de batata-doce cozida e amassada 200 g de frango cozido desfiado e temperado 2 col. (sopa) de farinha de arroz sal temperos farinha de aveia pra empanar 6 unidades. 180 °c 20 min, virando na metade. "},{"id":"13-R2-32","nome":"Banana chips sem açúcar","cat":["Air fryer","Lanche"],"fonte":"Receitas com Air Fryer","url":"https://receitascomairfryer.com.br/receitinhas-fit-na-airfryer-pratos-saudaveis-que-voce-precisa-experimentar/","tempo":"~30 min","min":30,"dif":1,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["1 banana-prata ou nanica firme","Canela opcional"],"prep":["Rodelas de 3 mm em camada única, 150 °C 20 a 25 min, sacudindo a cada 8. Tirar antes de secar de vez: fica crocante ao esfriar."],"busca":"banana chips sem acucar 1 banana-prata ou nanica firme canela opcional rodelas de 3 mm em camada unica, 150 °c 20 a 25 min, sacudindo a cada 8. tirar antes de secar de vez: fica crocante ao esfriar. "},{"id":"13-R2-33","nome":"Bolinho de banana-da-terra com tapioca","cat":["Air fryer","Lanche"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/bolinho-de-banana-com-tapioca-na-air-fryer","tempo":"até 1 h","min":60,"dif":2,"sal":"baixo","eq":["af"],"prot":["Sem proteína"],"ing":["¼ xíc. de banana-da-terra grelhada","¼ xíc. de tapioca granulada","¼ xíc. de água morna","2 col. (sopa) de açúcar","¼ col. (chá) de canela","Doce de leite pra servir"],"prep":["8 unidades.","Banana picada em purê, mistura tudo, 20 min de descanso. Pré-aquece 200 °C, assa 15 min sem virar, cesto untado."],"busca":"bolinho de banana-da-terra com tapioca ¼ xic. de banana-da-terra grelhada ¼ xic. de tapioca granulada ¼ xic. de agua morna 2 col. (sopa) de acucar ¼ col. (cha) de canela doce de leite pra servir 8 unidades. banana picada em pure, mistura tudo, 20 min de descanso. pre-aquece 200 °c, assa 15 min sem virar, cesto untado. "}],"B":[{"titulo":"Temperatura segura no centro","id":"temperatura-segura-no-centro","html":"<ul><li><strong>Frango<\/strong>, qualquer corte: <strong>74 °C<\/strong>.<\/li><li><strong>Carne moída<\/strong> (boi, porco, cordeiro): <strong>71 °C<\/strong>.<\/li><li><strong>Carne de porco e peça inteira de boi<\/strong>: <strong>63 °C<\/strong>, mais 3 min de descanso.<\/li><li><strong>Peixe<\/strong>: <strong>63 °C<\/strong>, ou opaco e soltando em lascas.<\/li><li>Ovo em prato cozido: <strong>71 °C<\/strong>. Sobra reaquecida: <strong>74 °C<\/strong> no centro.<\/li><\/ul><p>Meça no centro da parte mais grossa, sem encostar no osso. Confira antes do tempo previsto: faltou, devolve; passou, não tem volta. Ponto do boi no centro: mal passada 49 a 52 °C, ao ponto 60 a 63 °C, bem passada 71 °C ou mais. Abaixo de 63 °C fica abaixo da régua de segurança pra corte inteiro.<\/p>"},{"titulo":"A sobra do arroz","id":"a-sobra-do-arroz","html":"<p>O arroz carrega esporos de uma bactéria (<em>Bacillus cereus<\/em>) que sobrevivem ao cozimento. Se o arroz esfria devagar na bancada, ela se multiplica e produz uma toxina que <strong>o calor não destrói<\/strong>: reaquecer mata a bactéria, não a toxina.<\/p><ul><li><strong>Arroz esquecido a noite inteira na bancada vai fora.<\/strong> Reaquecer não resolve.<\/li><li>Esfrie rápido, em <strong>pote raso<\/strong> (camada de menos de 5 cm), e leve à geladeira <strong>em até 1 hora<\/strong>.<\/li><li>Na geladeira, <strong>no máximo 1 dia<\/strong>.<\/li><li>Reaqueça <strong>só a porção do prato, uma vez<\/strong>, até sair vapor do meio.<\/li><li>O truque: <strong>separe a porção do jantar antes de servir o almoço<\/strong>, direto da panela pros potes.<\/li><\/ul>"},{"titulo":"Fogo no óleo","id":"fogo-no-oleo","html":"<p><strong>Nunca jogue água em óleo pegando fogo.<\/strong> A água afunda, vira vapor na hora e espalha o óleo em chamas pra cima.<\/p><ol><li><strong>Desligue o fogo<\/strong>, se der pra alcançar o botão sem passar o braço por cima da chama.<\/li><li><strong>Abafe com uma tampa de metal<\/strong> (não de vidro), deslizando por cima até cobrir a panela inteira.<\/li><li><strong>Não destampe<\/strong> até a panela esfriar por completo: destampar cedo reacende.<\/li><\/ol><p>Sem tampa à mão: bicarbonato de sódio ou sal, em quantidade generosa, de uma vez. Farinha e fermento pioram. Fogo grande demais pra abafar: saia do cômodo, feche a porta e ligue <strong>193<\/strong>. Óleo soltando fumaça é aviso: desligue. Óleo quente não se abandona.<\/p>"},{"titulo":"Panela de pressão: as travas","id":"panela-de-pressao-as-travas","html":"<ul><li><strong>Nunca encha além de 2/3.<\/strong> Feijão e o que espuma e incha: metade, no máximo. O que espuma muito: um terço.<\/li><li><strong>Nunca abra sob pressão.<\/strong> Espere sair sozinha ou libere pela válvula. Não force a tampa, nunca.<\/li><li><strong>Nunca use sem líquido.<\/strong> Sem água não há vapor, só metal superaquecendo.<\/li><li><strong>Confira a válvula e o anel de vedação<\/strong> de vez em quando. Válvula entupida é a falha perigosa: desobstrua antes de usar.<\/li><li>O tempo de pressão conta <strong>a partir do apito<\/strong>, não de quando acendeu o fogo.<\/li><\/ul>"},{"titulo":"Mise en place","id":"mise-en-place","html":"<p>Francês pra \"posto no lugar\": <strong>separar, medir e cortar tudo antes de ligar o fogo<\/strong>. Com a panela quente o relógio não para, e o alho queima enquanto você corta a cebola.<\/p><ol><li>Leia a receita <strong>inteira<\/strong> antes de tocar em qualquer coisa.<\/li><li>Separe todos os ingredientes na bancada.<\/li><li>Corte tudo e ponha em tigelas, <strong>na ordem em que vão entrar<\/strong>.<\/li><li>Só então ligue o fogo ou o aparelho.<\/li><li>Lave tábua e faca enquanto a comida cozinha.<\/li><\/ol>"},{"titulo":"Refogado base","id":"refogado-base","html":"<p>Cebola, alho e gordura. <strong>A cebola vai primeiro<\/strong>, em fogo médio, até ficar <strong>translúcida<\/strong> (semitransparente, sem dourar). <strong>O alho entra depois<\/strong>, em fogo médio-baixo, por <strong>30 a 60 segundos<\/strong>: pronto quando o cheiro sobe e as bordas começam a dourar de leve. Aí entra o próximo ingrediente, que trava o alho.<\/p><p><strong>Alho queimado não tem conserto:<\/strong> jogue fora e recomece. Tempero seco e duro entra cedo, na gordura; erva fresca, ácido e pimenta moída entram no fim, fora do fogo.<\/p>"},{"titulo":"Fogo baixo, médio e alto","id":"fogo-baixo-medio-e-alto","html":"<div class=\"tw\"><table><tr><th>Fogo<\/th><th>Pra quê<\/th><\/tr><tr><td><strong>Alto<\/strong><\/td><td>Ferver água, criar crosta rápida em carne. Por fora cozinha rápido e o miolo não acompanha<\/td><\/tr><tr><td><strong>Médio<\/strong><\/td><td>O dia a dia: refogado, a maior parte do que vai na frigideira, ovo frito e omelete<\/td><\/tr><tr><td><strong>Baixo<\/strong><\/td><td>Tempo longo sem queimar: ovo mexido cremoso, molho engrossando, arroz depois de ferver<\/td><\/tr><\/table><\/div>"},{"titulo":"Selar","id":"selar","html":"<p>Pôr a carne em superfície muito quente pra criar uma <strong>crosta<\/strong> dourada.<\/p><ol><li><strong>Seque com papel toalha.<\/strong> Água vira vapor, e vapor não doura.<\/li><li><strong>Sal na hora, ou 45 min a 1 h antes.<\/strong> Nunca no meio disso.<\/li><li><strong>Pré-aqueça bem.<\/strong> Gota d'água na panela seca dança em bolinha.<\/li><li><strong>Não lote.<\/strong> Se o chiado some quando a carne entra, lotou.<\/li><li><strong>Não mexa.<\/strong> A carne solta sozinha quando a crosta está pronta.<\/li><li><strong>Descanse depois<\/strong>, de 3 a 10 min conforme o tamanho.<\/li><\/ol><p>Fogo alto pra selar, médio ou baixo pra terminar por dentro. Óleo neutro, panela de inox ou ferro.<\/p>"},{"titulo":"Ponto do legume","id":"ponto-do-legume","html":"<p><strong>Al dente<\/strong> (\"no dente\") é o legume cozido mas ainda com uma leve resistência quando você morde.<\/p><p><strong>Sinal concreto:<\/strong> espete o pedaço maior com a ponta de uma faca ou garfo. Entra sem força e encontra uma resistência leve no centro: al dente. Entra sem resistência nenhuma e o pedaço começa a desmanchar: passou. Teste um minuto antes do fim do tempo.<\/p><p><strong>As cinco categorias.<\/strong> Quanto mais duro o legume, mais tempo de calor ele precisa. Não dá pra decorar um tempo por legume: decore cinco categorias, e qualquer legume novo cai numa delas.<\/p><div class=\"tw\"><table><tr><th>Categoria<\/th><th>Exemplos<\/th><th>Método preferido<\/th><th>Tempo (fervura, pedaço médio)<\/th><\/tr><tr><td>Raiz dura<\/td><td>Beterraba, cenoura grande, inhame<\/td><td>Cozer ou assar<\/td><td>20 a 30 min; 15 a 20 min na air fryer a 200 graus<\/td><\/tr><tr><td>Tubérculo<\/td><td>Batata, batata-doce, mandioca, mandioquinha<\/td><td>Vapor ou fervura curta<\/td><td>15 a 20 min em cubos<\/td><\/tr><tr><td>Crucífera<\/td><td>Brócolis, couve-flor, repolho<\/td><td>Vapor ou refogado rápido<\/td><td>4 a 6 min no vapor, 3 a 5 refogando<\/td><\/tr><tr><td>Folhosa<\/td><td>Couve, espinafre, acelga<\/td><td>Refogado rápido<\/td><td>2 a 4 min<\/td><\/tr><tr><td>Legume-fruto<\/td><td>Abobrinha, chuchu, abóbora<\/td><td>Refogar ou cozer<\/td><td>8 a 12 min em cubos<\/td><\/tr><\/table><\/div><p><strong>Corte do mesmo tamanho.<\/strong> O tempo da tabela vale pra pedaço médio. Na mesma panela, pedaço grande e pedaço pequeno não ficam prontos juntos: o pequeno vira papa enquanto o grande ainda está cru.<\/p>"},{"titulo":"Prato sem graça: o diagnóstico","id":"prato-sem-graca-o-diagnostico","html":"<p>Quatro elementos controlam a maior parte do resultado. Ajuste perguntando o que falta, nesta ordem:<\/p><ol><li><strong>Falta sal?<\/strong> Parece sem gosto nenhum.<\/li><li><strong>Falta ácido?<\/strong> O sal está certo, mas o prato parece pesado ou morto. Gotas de limão ou vinagre.<\/li><li><strong>Falta gordura?<\/strong> Seco na boca, ou o sabor não \"gruda\". Um fio de azeite.<\/li><li><strong>Falta calor?<\/strong> Os três acima ajustados e ainda sem graça: faltou tostar.<\/li><\/ol><p>Na maioria das vezes, prato sem graça é <strong>falta de ácido ou de tostar<\/strong>, não de tempero.<\/p>"},{"titulo":"Glossário","id":"glossario","html":"<ul><li><strong>Selar:<\/strong> pôr a carne em superfície muito quente pra criar uma crosta dourada.<\/li><li><strong>Refogar:<\/strong> cozinhar alimento picado em pouca gordura quente, mexendo, até amolecer e soltar aroma.<\/li><li><strong>Al dente:<\/strong> cozido, com um pontinho firme no centro quando você morde.<\/li><li><strong>Mantecar:<\/strong> o fim do risoto. Fogo desligado, entram manteiga e queijo, e se mexe com vigor até virar creme.<\/li><li><strong>Dourar:<\/strong> a superfície ganhar cor dourada e sabor tostado (reação de Maillard, entre 140 e 165 °C na superfície).<\/li><li><strong>Reduzir:<\/strong> ferver destampado até parte da água evaporar; o molho engrossa e o sabor concentra.<\/li><li><strong>Gratinar:<\/strong> levar ao forno ou à air fryer até a camada de cima derreter e dourar.<\/li><li><strong>Ponto:<\/strong> o grau de cozimento que se procura (no boi, de mal passada a bem passada; no ovo, de gema líquida a dura), conferido pelo sinal: termômetro, garfo, cor.<\/li><\/ul>"},{"titulo":"Tempero: quando entra e com o que combina","id":"tempero","html":"<h4>Quando cada um entra<\/h4><p><strong>O motivo químico.<\/strong> O aroma das especiarias secas mora em compostos que se dissolvem em gordura e evaporam com facilidade. Aquecer o tempero seco na gordura quente por alguns segundos (a técnica tem nome em inglês, <strong>bloom<\/strong>, \"desabrochar\") solta esse aroma no óleo, e o óleo espalha pelo prato. Jogado cru, ou só no fim, o aroma fica preso.<\/p><div class=\"tw\"><table><tr><th>Quando<\/th><th>O que entra<\/th><th>Por quê<\/th><\/tr><tr><td><strong>No começo, na gordura quente<\/strong><\/td><td>Temperos secos moídos (cominho, páprica, curry, colorau, alho e cebola em pó) e aromáticos duros (alho, cebola, gengibre)<\/td><td>Precisam da gordura quente pra soltar aroma. 30 segundos a 1 minuto, só até perfumar. Queimar é amargar.<\/td><\/tr><tr><td><strong>No meio<\/strong><\/td><td>Ervas secas resistentes (louro, orégano, tomilho, alecrim) e o sal de base<\/td><td>Aguentam fervura longa sem perder o aroma.<\/td><\/tr><tr><td><strong>Só no fim, fora do fogo<\/strong><\/td><td>Erva fresca delicada (cebolinha, manjericão), o ácido, a pimenta-do-reino moída na hora<\/td><td>A erva murcha, o ácido evapora e perde força fervendo, e o aroma da pimenta degrada rápido com calor.<\/td><\/tr><\/table><\/div><p><strong>A regra pra decorar: seco e duro entra cedo, fresco e delicado entra tarde.<\/strong><\/p><p><strong>Erva seca ou fresca.<\/strong> Folha macia (cebolinha, manjericão, hortelã) só vale fresca: o óleo aromático evapora na secagem. Erva resinosa (orégano, louro, tomilho, alecrim, manjerona) vale seca. <strong>Conversão: 1 colher de sopa de fresca picada equivale a 1 colher de chá de seca<\/strong>, porque a seca é três vezes mais concentrada. Na dúvida, sempre menos no começo.<\/p><h4>Com o que combina<\/h4><p>Combina com cada ingrediente, cruzando <em>The Flavor Bible<\/em> com a tradição brasileira. A coluna da direita é <strong>convenção cultural, não incompatibilidade química<\/strong>: você pode testar e gostar.<\/p><div class=\"tw\"><table><tr><th>Ingrediente<\/th><th>Combina<\/th><th>Fora da tradição daqui<\/th><\/tr><tr><td><strong>Carne bovina<\/strong><\/td><td>alho, cebola, louro, alecrim, tomilho, páprica, pimenta-do-reino, cominho (mais em moída e guisado), vinho tinto, mostarda<\/td><td>canela e cravo isolados<\/td><\/tr><tr><td><strong>Frango<\/strong><\/td><td>alho, limão, páprica, páprica defumada, tomilho, alecrim, curry, gengibre, mostarda<\/td><td>canela em excesso<\/td><\/tr><tr><td><strong>Porco<\/strong><\/td><td>alho, cominho, louro, laranja, páprica, mostarda, alecrim<\/td><td>manjericão fresco puro, some na gordura<\/td><\/tr><tr><td><strong>Peixe<\/strong><\/td><td>limão, alho, azeite, páprica leve, gengibre, erva-doce<\/td><td>orégano seco forte, mascara o peixe; cominho em excesso<\/td><\/tr><tr><td><strong>Ovos<\/strong><\/td><td>cebolinha, páprica, queijo, pimenta-do-reino, manteiga<\/td><td>canela; cominho puro sem contexto<\/td><\/tr><tr><td><strong>Feijão<\/strong><\/td><td>alho, cebola, louro, cominho, carne defumada, pimenta<\/td><td>canela e cravo, soam doces<\/td><\/tr><tr><td><strong>Lentilha<\/strong><\/td><td>cominho, louro, alho, cebola, limão no fim, curry<\/td><td>manjericão fresco, ela pede tempero mais terroso<\/td><\/tr><tr><td><strong>Arroz<\/strong><\/td><td>alho, cebola, açafrão-da-terra, louro<\/td><td>pimenta forte crua<\/td><\/tr><tr><td><strong>Batata<\/strong><\/td><td>alho, alecrim, páprica, cebolinha, manteiga, pimenta-do-reino<\/td><td>canela; cominho puro sem contexto<\/td><\/tr><tr><td><strong>Abóbora<\/strong><\/td><td>canela discreta, gengibre, noz-moscada, cominho na versão salgada, alho, cebola<\/td><td>manjericão forte, choca com o doce natural<\/td><\/tr><tr><td><strong>Cenoura<\/strong><\/td><td>gengibre, cominho, canela leve, alho<\/td><td>pimenta muito forte, mascara o doce<\/td><\/tr><tr><td><strong>Tomate<\/strong><\/td><td>manjericão, orégano, alho, azeite, um toque de açúcar pra equilibrar<\/td><td>canela em prato salgado<\/td><\/tr><tr><td><strong>Couve<\/strong><\/td><td>alho, limão, pimenta<\/td><td>canela, noz-moscada<\/td><\/tr><tr><td><strong>Brócolis<\/strong><\/td><td>alho, limão, azeite, parmesão, pimenta<\/td><td>especiaria doce<\/td><\/tr><tr><td><strong>Chuchu<\/strong><\/td><td>alho, cebola, cebolinha, um toque de curry<\/td><td>pimenta muito forte, ele é sutil e se perde<\/td><\/tr><tr><td><strong>Berinjela<\/strong><\/td><td>alho, azeite (ela absorve muito, vá com cuidado), páprica defumada, cominho, tomate, orégano<\/td><td>canela fora de contexto árabe<\/td><\/tr><\/table><\/div><p>Repare num padrão que a tabela mostra sem dizer: <strong>alho e cebola combinam com quase tudo do lado salgado<\/strong>, e é por isso que o <a href=\"#\" class=\"goto\" data-goto=\"r:casa-3-Ficha4\">refogado base<\/a> é a base de tantos pratos.<\/p>","colapsa":"1"},{"titulo":"Ingrediente novo","html":"<p><strong>Antes de comprar, responda no caderno:<\/strong><\/p><ol><li><strong>É proteína ou legume?<\/strong> Sinal: você sabe dizer em qual tabela da trilha ele cai.<\/li><li><strong>Se proteína: colágeno alto ou baixo?<\/strong> Corte de músculo que trabalha (pescoço, peito, pernas) é alto. Sinal: você escolheu pressão ou calor seco antes de ligar o fogo.<\/li><li><strong>Se legume: qual das cinco categorias?<\/strong> Sinal: você tem um tempo de partida da <a href=\"#\" class=\"goto\" data-goto=\"b:ponto-do-legume\">tabela das cinco categorias de legume<\/a>.<\/li><li><strong>Qual o sinal de pronto?<\/strong> Sinal: um número no termômetro, ou o teste da faca. Nunca \"até ficar pronto\".<\/li><li><strong>Que tempero?<\/strong> Dois da <a href=\"#\" class=\"goto\" data-goto=\"b:tempero\">tabela de afinidade<\/a>, no máximo. Sinal: você sabe se cada um entra no começo, no meio ou no fim.<\/li><li><strong>Execute, prove, passe pela sequência sal, ácido, gordura, calor.<\/strong><\/li><li><strong>Anote:<\/strong> tempo real contra tempo da tabela. Divergência grande é fogo ou corte errado.<\/li><\/ol>","id":"ingrediente-novo"},{"titulo":"Cardápio de 5 dias","html":"<ol><li><strong>Olhe a geladeira, o freezer e a despensa.<\/strong> Sinal: lista do que já tem, escrita.<\/li><li><strong>Escolha os 4 componentes da semana:<\/strong> um carboidrato, uma leguminosa, uma ou duas proteínas, um ou dois legumes. Sinal: os quatro preenchidos, carboidrato incluso.<\/li><li><strong>Escreva os 5 almoços<\/strong> combinando componentes e fórmulas-mãe. Sinal: nenhum nome de prato repetido.<\/li><li><strong>Marque o ingrediente novo da semana<\/strong>, se houver, e passe pela <a href=\"#\" class=\"goto\" data-goto=\"b:ingrediente-novo\">ficha do ingrediente novo<\/a>. Sinal: ele tem método e sinal de pronto definidos.<\/li><li><strong>Lista de compras: só o que falta.<\/strong> Sinal: cada item da lista aparece em algum dos 5 almoços.<\/li><li><strong>Lote de domingo<\/strong> pela <a href=\"#\" class=\"goto\" data-goto=\"r:casa-7-Ficha7.4\">ficha do lote de domingo<\/a>. Sinal: dentro de 3 horas, tudo etiquetado.<\/li><li><strong>No fim da semana, uma linha no caderno:<\/strong> o que sobrou sem uso. Sinal: na semana seguinte, a lista é menor nesse item.<\/li><\/ol>","id":"cardapio-de-5-dias"}],"P":[{"titulo":"A base que não muda","html":"<div class=\"tw\"><table><tr><th>Item<\/th><th>Quanto, pra almoço de 4 + jantar de 5<\/th><th>Como<\/th><\/tr><tr><td><strong>Arroz<\/strong><\/td><td><strong>3 xícaras de arroz cru (~540 g) e 6 de água<\/strong><\/td><td>No fogão, como você já faz.<\/td><\/tr><tr><td><strong>Feijão<\/strong><\/td><td><strong>~450 g de feijão cru<\/strong>, ou 1 pote do lote congelado<\/td><td>Do lote da semana (<a href=\"#\" class=\"goto\" data-goto=\"p:feijao-cozinha-uma-vez-por-semana\">Feijão: cozinha uma vez por semana<\/a>).<\/td><\/tr><tr><td><strong>Proteína<\/strong><\/td><td><strong>~1,6 kg sem osso, ou ~2,7 kg com osso<\/strong><\/td><td>Tempera tudo no almoço. <strong>Metade vai pra air fryer no almoço, metade fica crua na geladeira pro jantar<\/strong> (<a href=\"#\" class=\"goto\" data-goto=\"p:a-ordem-do-dia\">A ordem do dia<\/a>).<\/td><\/tr><tr><td><strong>Acompanhamento<\/strong> (opcional)<\/td><td>purê de batata, legume<\/td><td>No fogão, junto com o arroz, já na quantidade das duas refeições. Reaquece no micro-ondas.<\/td><\/tr><tr><td><strong>Salada<\/strong><\/td><td><strong>1 saco de folha \"pronto para consumo\"<\/strong> + tomate-cereja + cenoura ralada pronta<\/td><td>Só na hora de servir. Molho em pote à parte.<\/td><\/tr><\/table><\/div><p><strong>Molho da salada pra família:<\/strong> 3 colheres (sopa) de limão, 6 a 9 de azeite, 1 colher (sopa) de mostarda, 1 de mel, pimenta, orégano. <strong>Sem sal:<\/strong> quem quiser põe no prato.<\/p>","id":"a-base-que-nao-muda"},{"titulo":"A ordem do dia","html":"<p><strong>Almoço (cerca de 45 min)<\/strong><\/p><div class=\"tw\"><table><tr><th>Min<\/th><th>Fogão<\/th><th>Air fryer<\/th><th>Mãos<\/th><\/tr><tr><td>0<\/td><td><\/td><td>liga pra pré-aquecer (3 a 5 min)<\/td><td>tira a proteína da geladeira, seca com papel, tempera <strong>tudo<\/strong>. <strong>Separa a metade do jantar num pote fechado e devolve pra geladeira<\/strong><\/td><\/tr><tr><td>2<\/td><td>boca 1: arroz<\/td><td><\/td><td><\/td><\/tr><tr><td>7<\/td><td>arroz ferveu: fogo baixo e tampa<\/td><td><strong>entra a carne do almoço<\/strong><\/td><td><\/td><\/tr><tr><td>10<\/td><td>boca 2: feijão, fogo baixo<\/td><td><\/td><td><\/td><\/tr><tr><td>15 a 25<\/td><td><\/td><td>se usar as duas assadeiras, <strong>troca uma com a outra na metade<\/strong><\/td><td>monta a salada<\/td><\/tr><tr><td>~27<\/td><td>desliga o arroz, 5 min tampado<\/td><td>confere a temperatura<\/td><td><\/td><\/tr><tr><td>32<\/td><td><\/td><td>carne vai pra mesa<\/td><td><strong>separa arroz e feijão do jantar em potes rasos, geladeira em até 1 hora<\/strong><\/td><\/tr><\/table><\/div><p>Se o corte pede mais de 25 min de air fryer, a carne entra <strong>antes<\/strong> do arroz.<\/p><p><strong>Jantar (cerca de 25 min, sem fogão)<\/strong><\/p><div class=\"tw\"><table><tr><th>Min<\/th><th>Air fryer<\/th><th>Micro-ondas<\/th><th>Mãos<\/th><\/tr><tr><td>0<\/td><td>liga pra pré-aquecer<\/td><td><\/td><td>tira a carne temperada da geladeira<\/td><\/tr><tr><td>5<\/td><td><strong>entra a carne do jantar<\/strong>, mesmo tempo e temperatura do almoço<\/td><td><\/td><td>monta a salada<\/td><\/tr><tr><td>fim<\/td><td>confere a temperatura<\/td><td><strong>arroz e feijão, um de cada vez, até sair vapor do meio<\/strong><\/td><td>serve<\/td><\/tr><\/table><\/div><p><strong>Carne crua temperada na geladeira:<\/strong> pote fechado, na prateleira de baixo (se pingar, não cai em cima de comida pronta), e assa no mesmo dia. <strong>Peixe e camarão: tempere a parte do jantar só na hora do jantar.<\/strong> O limão \"cozinha\" o peixe cru se ficar horas nele, e a textura muda.<\/p>","id":"a-ordem-do-dia"},{"titulo":"Rodízio de duas semanas","id":"rodizio-duas-semanas","html":"<p><strong>Rodízio sugerido de duas semanas<\/strong> (segunda a sexta; é sugestão, troque à vontade):<\/p><div class=\"tw\"><table><tr><th><\/th><th>Seg<\/th><th>Ter<\/th><th>Qua<\/th><th>Qui<\/th><th>Sex<\/th><\/tr><tr><td>Semana A<\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-1\">1 Coxa e sobrecoxa<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-2\">2 Almôndegas<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-6\">6 Suíno com ervas<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-10\">10 Tilápia<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-8\">8 Hambúrguer<\/a><\/td><\/tr><tr><td>Semana B<\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-5\">5 Sobrecoxa<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-7\">7 Fraldinha<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-3\">3 Coxinha no iogurte<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-9\">9 Lombo<\/a><\/td><td><a href=\"#\" class=\"goto\" data-goto=\"r:cardapio-4\">4 Frango na aveia<\/a><\/td><\/tr><\/table><\/div><p>O número antes de cada prato é o número dele no <strong>Cardápio da família<\/strong> (categoria da aba Receitas). Toque no prato pra abrir a receita.<\/p><p><strong>Acompanhamento extra, quando der vontade<\/strong> (vai na leva 2 ou entra na air fryer enquanto vocês comem): batata rústica (4 batatas em meia-lua, azeite, alho, páprica, 200 °C 20 a 25 min) ou brócolis (8 a 10 min a 190 °C).<\/p>"},{"titulo":"Semana extra 1: O básico da air fryer: peça simples e termômetro","id":"rodizio-extra-1","html":"<p><em>Mais seis semanas de rodízio, cada uma treinando uma técnica. Toque no prato ou no acompanhamento pra abrir a receita.<\/em><\/p><p><strong>Dificuldade:<\/strong> até Fácil<\/p><p>Cinco receitas de tempero curto, em que se aprende a ler o ponto pelo termômetro e pelo garfo, não pelo relógio.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-22\">Frango em cubos com legumes<\/a><br/><span class=\"rz-nota\">Proteína e legume na mesma assadeira. Frango pronto a 74 °C no centro do cubo maior.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-39\">Filé de tilápia com limão<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-8\">Brócolis crocante<\/a><br/><span class=\"rz-nota\">A parte do jantar se tempera só na hora do jantar. Pronto quando desmancha no garfo.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-31\">Filé mignon suíno básico<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-3\">Batata-bolinha assada<\/a><br/><span class=\"rz-nota\">63 °C no centro e 5 minutos de descanso antes de fatiar.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:09-35\">Suflê de brócolis<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-11\">Batata-doce em rodelas<\/a><br/><span class=\"rz-nota\">Dia de ovo. Confira na ficha quantas porções rende e multiplique.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-26\">Carne assada com manteiga<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-5\">Couve-flor com ervas<\/a><br/><span class=\"rz-nota\">Peça inteira de boi: 63 °C no centro e pelo menos 3 min de descanso (5 se a peça for grande) antes de fatiar.<\/span><\/li><\/ul>"},{"titulo":"Semana extra 2: Marinada curta e peça pequena","id":"rodizio-extra-2","html":"<p><strong>Dificuldade:<\/strong> até Fácil<\/p><p>Marinar pouco tempo e assar peça pequena: aprende-se que o tempero penetra rápido e que peça pequena passa do ponto em poucos minutos.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-1\">Shawarma de frango<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-10\">Mix de pimentões e cebola<\/a><br/><span class=\"rz-nota\">Tempere tudo no almoço e guarde a metade do jantar crua, em pote fechado.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-11\">Contrafilé com batata rústica<\/a><br/><span class=\"rz-nota\">Mão leve no sal, que vai só na hora de assar.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-42\">Salmão com limão<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-17\">Berinjela simples<\/a><br/><span class=\"rz-nota\">Peixe não fica horas no limão: tempere a parte do jantar só no jantar.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-24\">Mix de legumes com grão-de-bico crocante<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:08-49\">Ovo cozido por ponto<\/a><br/><span class=\"rz-nota\">Dia vegetal. O ovo cozido entra como proteína extra no prato.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-47\">Camarão com alho e limão<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-2\">Abóbora assada com tomilho<\/a><br/><span class=\"rz-nota\">Camarão passa do ponto rápido: siga o tempo da ficha e não estique.<\/span><\/li><\/ul>"},{"titulo":"Semana extra 3: Crosta seca: empanar e dourar","id":"rodizio-extra-3","html":"<p><strong>Dificuldade:<\/strong> até Média<\/p><p>A técnica da semana é deixar a superfície seca e a crosta fina, que é o que separa o assado crocante do cozido murcho.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-5\">Coxinha da asa com fubá<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-12\">Palitos de inhame ou batata-doce<\/a><br/><span class=\"rz-nota\">Seque bem a carne com papel antes do fubá: superfície molhada não doura.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:10-24\">Kibe<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-7\">Abobrinha crocante<\/a><br/><span class=\"rz-nota\">Carne moída: 71 °C no centro.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-14\">Tilápia empanada na aveia<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-9\">Cenoura assada com ervas<\/a><br/><span class=\"rz-nota\">Empanado reaquece na air fryer, não no micro-ondas, que murcha a casca.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-51\">Omelete no ramequim<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:10-2\">Batata rústica<\/a><br/><span class=\"rz-nota\">Dia de ovo. Multiplique os ramequins pela família.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-29\">Costelinha de porco<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-26\">Beterraba em rodelas com alecrim<\/a><br/><span class=\"rz-nota\">Cerca de 60 minutos: entra antes do arroz. Costelinha tem muito colágeno: o ponto é desmanchando, e os 63 °C são só o piso de segurança.<\/span><\/li><\/ul>"},{"titulo":"Semana extra 4: Prato inteiro numa assadeira só","id":"rodizio-extra-4","html":"<p><strong>Dificuldade:<\/strong> até Média<\/p><p>Aprender a sincronizar ingredientes que assam em tempos diferentes na mesma assadeira, pelo tamanho do corte e pela ordem de entrada.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-21\">Coxas de frango com legumes e batata<\/a><br/><span class=\"rz-nota\">Corte os legumes do mesmo tamanho pra ficarem prontos juntos com o frango.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-36\">Peixe com legumes, robalo<\/a><br/><span class=\"rz-nota\">O legume entra antes, o peixe por último: o peixe leva menos tempo.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-12\">Cubos de alcatra acebolada com pimentão<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-27\">Cogumelos assados com tomilho<\/a><br/><span class=\"rz-nota\">Tempere com cebola e pimentão e acerte o sal no fim, provando.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:09-31\">Batata-doce recheada com feijão preto<\/a><br/><span class=\"rz-nota\">Cerca de 60 minutos: a batata entra antes do arroz.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-30\">Bisteca com vagem e tomate<\/a><br/><span class=\"rz-nota\">Cerca de 60 minutos, entra antes do arroz. Mão leve no sal. 63 °C no centro.<\/span><\/li><\/ul>"},{"titulo":"Semana extra 5: Molho e acabamento","id":"rodizio-extra-5","html":"<p><strong>Dificuldade:<\/strong> até Difícil<\/p><p>O passo depois do ponto: finalizar com molho, glaçar sem queimar e fatiar uma peça inteira do jeito certo.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-6\">Filé de frango com molho de mel<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-28\">Chuchu assado com cominho e canela<\/a><br/><span class=\"rz-nota\">Molho com mel doura rápido: fique de olho nos últimos minutos.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-20\">Rosbife de lagarto<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-1\">Legumes assados: abóbora, cenoura, brócolis<\/a><br/><span class=\"rz-nota\">Peça inteira: 63 °C, pelo menos 3 min de descanso (5 se a peça for grande), fatias finas contra a fibra. Mão leve no sal.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-13\">Salmão com alho-poró e tomatinhos<\/a><br/><span class=\"rz-nota\">Tempere a parte do jantar só no jantar.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:09-25\">Salada com rabanete e grão-de-bico assados<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-8\">Ovo poché no ramequim<\/a><br/><span class=\"rz-nota\">Dia vegetal. O ovo poché dá a proteína do prato.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-6\">Lombo em bifes com abacaxi<\/a><br/><span class=\"rz-nota\">O prato difícil da semana. Usa air fryer e fogão, cerca de 60 minutos. 63 °C no centro.<\/span><\/li><\/ul>"},{"titulo":"Semana extra 6: Moldar com a mão: bolinho, kafta e hambúrguer","id":"rodizio-extra-6","html":"<p><strong>Dificuldade:<\/strong> até Difícil<\/p><p>Moldar porções iguais com a mão, pra todas assarem no mesmo tempo, e fazer a massa dar liga sem ovo sobrando.<\/p><ul class=\"rz\"><li><strong>Seg<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-12\">Peito de frango assado com osso<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-15\">Milho-verde assado<\/a><br/><span class=\"rz-nota\">Com osso demora mais que o filé: meça os 74 °C no ponto mais grosso.<\/span><\/li><li><strong>Ter<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:08-25\">Kafta de carne moída<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:10-1\">Batata frita<\/a><br/><span class=\"rz-nota\">Carne moída: 71 °C no centro. Mão leve no sal.<\/span><\/li><li><strong>Qua<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-16\">Pescada em papelote com tomate e pimentão<\/a><br/><span class=\"rz-nota\">O papelote cozinha no vapor: abra com cuidado, que sai quente.<\/span><\/li><li><strong>Qui<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:09-26\">Hambúrguer de grão-de-bico<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:10-3\">Mandioca congelada pré-cozida<\/a><br/><span class=\"rz-nota\">O prato difícil da semana: a massa precisa dar liga pra não desmanchar na grade.<\/span><\/li><li><strong>Sex<\/strong>: <a href=\"#\" class=\"goto\" data-goto=\"r:13-R2-18\">Kibe fit de frango<\/a> + <a href=\"#\" class=\"goto\" data-goto=\"r:09-6\">Mix de legumes: batata, cenoura, abobrinha<\/a><br/><span class=\"rz-nota\">Frango de novo, pra variar o preparo. 74 °C no centro.<\/span><\/li><\/ul>"},{"titulo":"Feijão: cozinha uma vez por semana","html":"<ul><li>Cozinhe um lote grande na pressão, como você já faz. <strong>Congele com o caldo e SEM o refogado.<\/strong><\/li><li>Deixe esfriar antes de congelar. Pote ou saquinho até 3/4 (o caldo cresce no freezer), etiqueta com a data. <strong>Dura até 3 meses no freezer.<\/strong><\/li><li><strong>Um pote = um dia<\/strong> (cerca de 450 g de feijão cru equivalente).<\/li><li><strong>Na véspera, passe o pote do freezer pra geladeira.<\/strong> No dia: refogado na panela, um pouco do feijão amassado pra engrossar, o resto, e ferve.<\/li><li>Comece com lote de 3 ou 4 dias e aumente quando pegar o jeito.<\/li><\/ul>","id":"feijao-cozinha-uma-vez-por-semana"},{"titulo":"A sobra do jantar, com segurança","html":"<ul><li><strong>Arroz é o item de risco.<\/strong> Ele carrega esporos que sobrevivem ao cozimento. Por isso:<ul><li><strong>separe o arroz do jantar ANTES de servir o almoço<\/strong>, direto da panela pra potes rasos;<\/li><li>destampe uns minutos e <strong>geladeira em até 1 hora<\/strong>;<\/li><li><strong>reaqueça uma vez só<\/strong>, no micro-ondas, até sair vapor do meio. Sobrou de novo, vai fora.<\/li><\/ul><\/li><li><strong>Feijão, purê e legume:<\/strong> geladeira em até 2 horas, em potes menores. Duram 3 a 4 dias.<\/li><li><strong>Reaquecer:<\/strong> arroz, feijão e purê no micro-ondas (a air fryer resseca o arroz).<\/li><li><strong>Se sobrar carne assada<\/strong> (do almoço ou do jantar): air fryer, programa <strong>Reaquecer<\/strong> (115 °C, 12 min) ou 175 °C por 5 a 10 min, até 74 °C. Empanado só na air fryer: no micro-ondas murcha.<\/li><li><strong>Salada não sobra:<\/strong> à noite abra outro saco ou o resto do mesmo, e tempere na hora.<\/li><\/ul>","id":"a-sobra-do-jantar-com-seguranca"},{"titulo":"Lista de compras das receitas de air fryer","html":"<h4>Despensa fixa: ter sempre<\/h4><p>Com isto em casa você faz a maioria das receitas, faltando só a proteína e o legume do dia.<\/p><div class=\"tw\"><table><tr><th>Item<\/th><th>Receitas<\/th><th>Observação<\/th><\/tr><tr><td>Azeite<\/td><td>76<\/td><td>O item mais usado. Um borrifador ajuda a usar pouco<\/td><\/tr><tr><td>Sal fino<\/td><td>97<\/td><td>Quase todas.<\/td><\/tr><tr><td>Pimenta-do-reino moída<\/td><td>50<\/td><td><\/td><\/tr><tr><td>Alho (cabeça)<\/td><td>42<\/td><td><\/td><\/tr><tr><td>Alho em pó<\/td><td>11<\/td><td>Atalho quando não quer descascar<\/td><\/tr><tr><td>Ovos (1 a 2 dúzias)<\/td><td>38<\/td><td>Empanado, almôndega, omelete, bolo<\/td><\/tr><tr><td>Limão<\/td><td>27<\/td><td>Uns 10 por semana se seguir o cardápio<\/td><\/tr><tr><td>Cebola<\/td><td>22<\/td><td><\/td><\/tr><tr><td>Páprica doce<\/td><td>31<\/td><td>O tempero seco mais usado<\/td><\/tr><tr><td>Páprica defumada<\/td><td>6<\/td><td><\/td><\/tr><tr><td>Cominho<\/td><td>11<\/td><td><\/td><\/tr><tr><td>Orégano<\/td><td>8<\/td><td><\/td><\/tr><tr><td>Tomilho seco<\/td><td>8<\/td><td><\/td><\/tr><tr><td>Ervas finas<\/td><td>3<\/td><td><\/td><\/tr><tr><td>Alecrim seco<\/td><td>5<\/td><td><\/td><\/tr><tr><td>Cúrcuma (açafrão-da-terra)<\/td><td>5<\/td><td><\/td><\/tr><tr><td>Colorau<\/td><td>2<\/td><td><\/td><\/tr><tr><td>Canela em pó<\/td><td>9<\/td><td>Doces e o chuchu assado<\/td><\/tr><tr><td>Mel<\/td><td>10<\/td><td><\/td><\/tr><tr><td>Mostarda<\/td><td>4<\/td><td><\/td><\/tr><tr><td>Farinha de trigo<\/td><td>19<\/td><td>Empanar<\/td><\/tr><tr><td>Farinha de rosca<\/td><td>9<\/td><td>Empanar e almôndega<\/td><\/tr><tr><td>Aveia em flocos finos e farinha de aveia<\/td><td>8<\/td><td>O empanado mais leve do lote<\/td><\/tr><tr><td>Fubá mimoso<\/td><td>4<\/td><td>Coxinha da asa e sardinha crocante<\/td><\/tr><tr><td>Manteiga<\/td><td>16<\/td><td><\/td><\/tr><tr><td>Papel-manteiga e papel-alumínio<\/td><td><\/td><td>Papilote, abacate assado, forrar a assadeira<\/td><\/tr><\/table><\/div><h4>Açougue e peixaria<\/h4><div class=\"tw\"><table><tr><th>Item<\/th><th>Receitas<\/th><th>Pratos que mais usam<\/th><\/tr><tr><td>Peito / filé de frango (e sassami)<\/td><td>21<\/td><td>Shawarma, frango const TEMPOS=[["t20","Até 20 min",m=>m!=null&&m<=20],["t40","Até 40 min",m=>m!=null&&m<=40],
  ["tmais","Mais de 40 min",m=>m!=null&&m>40]];
const DIF_LABEL={1:"Fácil",2:"Média",3:"Difícil"};
const DIF_COLOR={1:"#4B5E2A",2:"#B8862E",3:"#A0522D"};

const GROUPS=[
  {k:"cat",label:"Categoria",opts:CATS.map(c=>[c,c])},

];

function norm(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}

function matchOne(r,k,v){
  if(k==="cat")return (r.cat||[]).includes(v);
  if(k==="prot")return (r.prot||[]).includes(v);
  if(k==="eq")return (r.eq||[]).includes(v);
  if(k==="tempo"){const t=TEMPOS.find(x=>x[0]===v);return t?t[2](r.min):true;}
  if(k==="dif")return String(r.dif)===v;
  if(k==="sal")return r.sal===v;
  return true;
}

function Badge({children,color,bg}){

function Badges({r}){
  const out=[];
  if(r.tempo)out.push(h(Badge,{key:"t"},r.tempo));
  if(r.dif)out.push(h(Badge,{key:"d",color:"#fff",bg:DIF_COLOR[r.dif]},DIF_LABEL[r.dif]));
  if(r.sal)out.push(h(Badge,{key:"s",color:r.sal==="baixo"?C.oliveD:"#fff",bg:r.sal==="baixo"?"#DDE5C4":C.warn},SAL_LABEL+": "+r.sal));
  (r.eq||[]).forEach(e=>out.push(h(Badge,{key:"e"+e,bg:"#E6E9DA"},EQ[e])));
  return h('div',{style:{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}},out);
}

function printCard(id){
  const el=document.getElementById("card-"+id);
  if(!el)return;
  document.body.classList.add("printing");el.classList.add("print-target");
  const done=()=>{document.body.classList.remove("printing");el.classList.remove("print-target");window.removeEventListener("afterprint",done);};
  window.addEventListener("afterprint",done);
  window.print();
  setTimeout(done,1500);
}

// Leva a tela ate o card ou bloco alvo de um link interno. Espera o React desenhar
// (filtro limpo, card aberto) e tenta de novo se o elemento ainda nao existe.
function irPara(domId,tent){
  const el=document.getElementById(domId);
  if(!el){if((tent||0)<10)setTimeout(()=>irPara(domId,(tent||0)+1),60);return;}
  const det=el.querySelector("details");if(det)det.open=true;
  el.scrollIntoView({block:"start"});
  el.classList.remove("alvo");void el.offsetWidth;el.classList.add("alvo");
}

        list.length===R.length?`${R.length} receitas`:`${list.length} de ${R.length}`),
      active.map(([k,v])=>{const gg=GROUPS.find(x=>x.k===k);const lab=(gg.opts.find(o=>o[0]===v)||[v,v])[1];
        return h('button',{key:k,onClick:()=>toggle(k,v),style:{fontSize:12,background:C.tag,border:`1px solid ${C.ruled}`,borderRadius:14,padding:"3px 9px",cursor:"pointer"}},gg.label+": "+lab+" ×");}),
      (active.length>0||q)&&h('button',{onClick:clear,"data-clear":"1",style:{fontSize:12,color:C.olive,background:"none",
        border:`1px solid ${C.olive}`,borderRadius:14,padding:"3px 10px",cursor:"pointer"}},"Limpar filtros")
    ),
    h('div',{className:"grid",style:{display:"grid",gridTemplateColumns:"minmax(0,1fr)",gap:12,padding:"0 14px 40px",maxWidth:1100,margin:"0 auto",alignItems:"start"}},
      list.length===0
        ?h('div',{style:{textAlign:"center",padding:"50px 20px",color:"#888"}},"Nenhuma receita com esses filtros.")
        :list.map(r=>h(RecipeCard,{key:r.id,r,open:!!open[r.id],onToggle:()=>setOpen(o=>({...o,[r.id]:!o[r.id]}))}))
    )
  );
}

function Painel({items,testid,alvo}){
  useEffect(()=>{
    if(!alvo||!((alvo.k==="b"&&testid==="basico")||(alvo.k==="p"&&testid==="planejar")))return;
    setTimeout(()=>irPara("bloco-"+alvo.id),80);
  },[alvo]);
  return h('div',{"data-panel":testid,style:{maxWidth:760,margin:"0 auto",padding:"14px 14px 40px",display:"grid",gridTemplateColumns:"minmax(0,1fr)",gap:12}},
    items.map((b,i)=>h('div',{key:i,id:b.id?"bloco-"+b.id:undefined,"data-bid":b.id,className:"recipe-card","data-bloco":testid,style:{background:C.paper,border:`1px solid ${C.ruled}`,borderRadius:12,padding:"14px 16px"}},
      b.colapsa
        ?h('details',null,h('summary',null,b.titulo),h('div',{className:"md",style:{marginTop:10},dangerouslySetInnerHTML:{__html:b.html}}))
        :h(React.Fragment,null,
          h('h3',{style:{fontFamily:"Georgia,serif",fontSize:18,color:C.oliveD,marginBottom:8}},b.titulo),
          h('div',{className:"md",dangerouslySetInnerHTML:{__html:b.html}}))
    ))
  );
}

function App(){
  const [tab,setTab]=useState("receitas");
  const [alvo,setAlvo]=useState(null);
  useEffect(()=>{window.scrollTo(0,0);},[tab]);
  // Link interno (<a data-goto="r:id"> ou "b:id"): troca de aba, abre o card e rola ate ele.
  // Grava a posicao atual no historico, entao o botao voltar do celular devolve pra onde estava.
  useEffect(()=>{
    const onClick=e=>{
      const a=e.target.closest&&e.target.closest("a[data-goto]");
      if(!a)return;
      e.preventDefault();e.stopPropagation();
      const g=a.getAttribute("data-goto");const k=g.slice(0,1),id=g.slice(2);
      const atual=document.querySelector("[data-tab].ativa");
      history.replaceState({tab:atual?atual.getAttribute("data-tab"):"receitas",y:window.scrollY},"");
      const destino={r:"receitas",b:"basico",p:"planejar"}[k]||"receitas";
      history.pushState({tab:destino,y:0},"");
      setTab(destino);
      setAlvo({k,id,n:Date.now()});
    };
    const onPop=e=>{
      const s=e.state;if(!s||!s.tab)return;
      setAlvo(null);setTab(s.tab);
      setTimeout(()=>window.scrollTo(0,s.y||0),120);
    };
    document.addEventListener("click",onClick,true);
    window.addEventListener("popstate",onPop);
    return ()=>{document.removeEventListener("click",onClick,true);window.removeEventListener("popstate",onPop);};
  },[]);
  const tabs=[["receitas","Receitas"],["basico","Básico"],["planejar","Planejar"]];
  return h('div',null,
    h('div',{className:"no-print",style:{background:`linear-gradient(160deg,${C.oliveD} 0%,${C.olive} 100%)`,padding:"22px 16px 12px",textAlign:"center"}},
      h('div',{style:{fontSize:11,color:"rgba(255,255,255,0.6)",letterSpacing:".18em"}},"RECEITAS, TÉCNICA E PLANEJAMENTO"),
      h('h1',{style:{margin:"4px 0 2px",color:"#fff",fontFamily:"Georgia,serif",fontSize:"clamp(26px,7vw,36px)"}},"Cozinha de Casa"),
      h('div',{style:{color:"#E5D9A6",fontSize:13}},R.length+" receitas e fichas")
    ),
    h('div',{className:"no-print",style:{position:"sticky",top:0,zIndex:20,background:C.oliveD,display:"flex",justifyContent:"center",gap:4,padding:"0 8px"}},
      tabs.map(([k,l])=>h('button',{key:k,"data-tab":k,className:tab===k?"ativa":"",onClick:()=>setTab(k),style:{
        flex:"1 1 0",maxWidth:200,padding:"11px 6px",background:"none",border:"none",cursor:"pointer",fontSize:15,
        color:tab===k?"#fff":"rgba(255,255,255,0.65)",fontWeight:tab===k?700:500,
        borderBottom:tab===k?`3px solid ${C.mustard}`:"3px solid transparent"}},l))),
    tab==="receitas"&&h(Receitas,{alvo}),
    tab==="basico"&&h(Painel,{items:B,testid:"basico",alvo}),
    tab==="planejar"&&h(Painel,{items:P,testid:"planejar",alvo}),
    h('div',{className:"no-print",style:{textAlign:"center",padding:"16px",borderTop:`1px solid ${C.ruled}`,color:"#8a8a74",fontSize:12}},
      "Receitas de terceiros: resumo com link pra fonte original. Confira a temperatura no centro com termômetro.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
