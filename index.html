const DATA={"R":[{"id":"casa-1-Ficha2","nome":"Legume no vapor no micro-ondas","cat":["Legumes e sopa"],"fonte":"Ficha da casa","tempo":"3 a 4 min","min":4,"dif":1,"eq":["mo"],"prot":["Sem proteína"],"html":"<p><strong>Micro-ondas, potência alta · 3 a 4 min<\/strong><\/p><p><strong>Precisa de:<\/strong> 1 brócolis pequeno ou 1 cenoura (cenoura em pedaços pequenos), tigela de vidro ou cerâmica, tampa de micro-ondas ou prato pra cobrir, garfo, sal.<\/p><ol><li><strong>Separe o brócolis em floretes<\/strong> puxando com a mão. Pedaços parecidos entre si. <em>Deu certo:<\/em> nenhum pedaço muito maior que os outros.<\/li><li><strong>Lave e ponha na tigela<\/strong> com <strong>3 a 4 colheres de água<\/strong> no fundo. A água vira o vapor que cozinha. <em>Deu certo:<\/em> fundo da tigela molhado, legume não submerso.<\/li><li><strong>Cubra com respiro e dê 3 minutos em potência alta.<\/strong><\/li><li><strong>Destampe longe do rosto<\/strong>, abrindo pelo lado oposto a você. O vapor sai de uma vez.<\/li><li><strong>Teste com o garfo<\/strong> no talo do maior florete. <em>Deu certo:<\/em> entra com <strong>leve resistência no meio<\/strong>. Isso tem nome: <strong>al dente<\/strong>, \"no dente\", macio por fora com um pouco de firmeza no centro. <em>Falta:<\/em> duro, volta 30 s e testa de novo. <em>Passou:<\/em> desmancha e a cor ficou opaca, anote no caderno e tire 1 min da próxima vez.<\/li><li><strong>Escorra a água<\/strong> e tempere: pitada de sal, fio de azeite, gotas de limão.<\/li><\/ol><p>Al dente sempre que der.<\/p>","casa":true,"busca":"legume no vapor no micro-ondas micro-ondas, potencia alta · 3 a 4 min precisa de: 1 brocolis pequeno ou 1 cenoura (cenoura em pedacos pequenos), tigela de vidro ou ceramica, tampa de micro-ondas ou prato pra cobrir, garfo, sal. separe o brocolis em floretes puxando com a mao. pedacos parecidos entre si. deu certo: nenhum pedaco muito maior que os outros. lave e ponha na tigela com 3 a 4 colheres de agua no fundo. a agua vira o vapor que cozinha. deu certo: fundo da tigela molhado, legume nao submerso. cubra com respiro e de 3 minutos em potencia alta. destampe longe do rosto , abrindo pelo lado oposto a voce. o vapor sai de uma vez. teste com o garfo no talo do maior florete. deu certo: entra com leve resistencia no meio . isso tem nome: al dente , \"no dente\", macio por fora com um pouco de firmeza no centro. falta: duro, volta 30 s e testa de novo. passou: desmancha e a cor ficou opaca, anote no caderno e tire 1 min da proxima vez. escorra a agua e tempere: pitada de sal, fio de azeite, gotas de limao. al dente sempre que der."},{"id":"casa-1-Ficha3","nome":"Ovo cozido na air fryer","cat":["Ovos"],"fonte":"Ficha da casa","tempo":"8 a 17 min","min":17,"dif":1,"eq":["af","mo"],"prot":["Ovo"],"html":"<p><strong>Air fryer, 120 a 130 graus · 8 a 17 min<\/strong><\/p><p><strong>As duas fontes divergem, e o seu aparelho é o juiz:<\/strong><\/p><div class=\"tw\"><table><tr><th>Fonte<\/th><th>Temperatura<\/th><th>Tempo<\/th><\/tr><tr><td>Panelinha<\/td><td>120, pré-aquecida<\/td><td>gema cozida 15 · cremosa 10 · mollet 9 · ovo quente 8<\/td><\/tr><\/table><\/div><p><strong>Mollet<\/strong> (pronuncia-se \"molê\") é clara firme com gema mole. <strong>Ovo quente<\/strong> é o ponto mais mole da lista da Panelinha.<\/p><p><strong>Precisa de:<\/strong> 2 ovos tirados da geladeira, pinça, tigela com água e gelo, luva.<\/p><ol><li><strong>Pré-aqueça a 120 graus<\/strong>, 3 a 5 min, e <strong>deixe a tigela de gelo pronta<\/strong> antes.<\/li><li><strong>Ovos na assadeira do meio<\/strong>, com pinça, sem bater um no outro.<\/li><li><strong>Programe o tempo da Panelinha.<\/strong> Comece pela gema cremosa, 10 min.<\/li><li><strong>Tire com pinça e mergulhe direto no gelo, 2 min.<\/strong> O gelo para o cozimento (o calor guardado no ovo continuaria cozinhando a gema) e facilita descascar. <em>Deu certo:<\/em> o ovo fica frio ao toque.<\/li><li><strong>Bata a casca na bancada e descasque.<\/strong> <em>Deu certo:<\/em> a casca sai em pedaços grandes.<\/li><li><strong>Corte ao meio e olhe a gema.<\/strong> Anote no caderno: temperatura, tempo, ponto que saiu. Na repetição seguinte, teste a outra fonte (130 graus) e compare.<\/li><\/ol><p><strong>Guardar:<\/strong> 1 semana na geladeira, não congela bem. Reaquecer no micro-ondas, só cortado.<\/p>","casa":true,"busca":"ovo cozido na air fryer air fryer, 120 a 130 graus · 8 a 17 min as duas fontes divergem, e o seu aparelho e o juiz: fonte temperatura tempo panelinha 120, pre-aquecida gema cozida 15 · cremosa 10 · mollet 9 · ovo quente 8 mollet (pronuncia-se \"mole\") e clara firme com gema mole. ovo quente e o ponto mais mole da lista da panelinha. precisa de: 2 ovos tirados da geladeira, pinca, tigela com agua e gelo, luva. pre-aqueca a 120 graus , 3 a 5 min, e deixe a tigela de gelo pronta antes. ovos na assadeira do meio , com pinca, sem bater um no outro. programe o tempo da panelinha. comece pela gema cremosa, 10 min. tire com pinca e mergulhe direto no gelo, 2 min. o gelo para o cozimento (o calor guardado no ovo continuaria cozinhando a gema) e facilita descascar. deu certo: o ovo fica frio ao toque. bata a casca na bancada e descasque. deu certo: a casca sai em pedacos grandes. corte ao meio e olhe a gema. anote no caderno: temperatura, tempo, ponto que saiu. na repeticao seguinte, teste a outra fonte (130 graus) e compare. guardar: 1 semana na geladeira, nao congela bem. reaquecer no micro-ondas, so cortado."},{"id":"casa-1-Ficha4","nome":"Ovo mexido no micro-ondas","cat":["Ovos"],"fonte":"Ficha da casa","tempo":"cerca de 2 a 2,5 min","min":5,"dif":1,"eq":["mo"],"prot":["Ovo"],"html":"<p><strong>Micro-ondas, potência alta · cerca de 2 a 2,5 min no total<\/strong><\/p><p><strong>Precisa de:<\/strong> 2 ovos, 1 a 2 colheres de sopa de leite ou água, pitada de sal, tigela de vidro ou cerâmica, garfo, papel toalha.<\/p><ol><li><strong>Quebre os ovos na tigela e bata com o garfo<\/strong> até a gema e a clara virarem uma mistura só. <em>Deu certo:<\/em> cor amarela uniforme, sem fio de clara transparente.<\/li><li><strong>Junte o leite ou a água e o sal.<\/strong> O líquido dilui a proteína do ovo e faz ela precisar de mais calor pra endurecer (perto de 79 graus em vez de 60 a 70), o que dá mais margem de erro e um mexido mais fofo.<\/li><li><strong>Cubra com papel toalha.<\/strong> Segura respingo sem vedar.<\/li><li><strong>1 minuto.<\/strong> <em>Deu certo:<\/em> as bordas firmaram, o meio ainda está líquido.<\/li><li><strong>Mexa com o garfo<\/strong>, trazendo a borda firme pro meio.<\/li><li><strong>Mais 1 minuto, e confira.<\/strong> Se ainda tiver líquido escorrendo, mais 30 s.<\/li><li><strong>Tire antes de parecer pronto.<\/strong> <em>Deu certo:<\/em> firme, mas <strong>ainda brilhante e úmido<\/strong>. O calor guardado no ovo termina o trabalho no prato em 1 minuto. Se tirou seco, vai comer borracha.<\/li><\/ol><p><strong>A lição:<\/strong> o <strong>calor residual<\/strong>. Comida fora do calor segue cozinhando um pouco. Por isso se tira o ovo, o peixe e a carne um pouco antes.<\/p>","casa":true,"busca":"ovo mexido no micro-ondas micro-ondas, potencia alta · cerca de 2 a 2,5 min no total precisa de: 2 ovos, 1 a 2 colheres de sopa de leite ou agua, pitada de sal, tigela de vidro ou ceramica, garfo, papel toalha. quebre os ovos na tigela e bata com o garfo ate a gema e a clara virarem uma mistura so. deu certo: cor amarela uniforme, sem fio de clara transparente. junte o leite ou a agua e o sal. o liquido dilui a proteina do ovo e faz ela precisar de mais calor pra endurecer (perto de 79 graus em vez de 60 a 70), o que da mais margem de erro e um mexido mais fofo. cubra com papel toalha. segura respingo sem vedar. 1 minuto. deu certo: as bordas firmaram, o meio ainda esta liquido. mexa com o garfo , trazendo a borda firme pro meio. mais 1 minuto, e confira. se ainda tiver liquido escorrendo, mais 30 s. tire antes de parecer pronto. deu certo: firme, mas ainda brilhante e umido . o calor guardado no ovo termina o trabalho no prato em 1 minuto. se tirou seco, vai comer borracha. a licao: o calor residual . comida fora do calor segue cozinhando um pouco. por isso se tira o ovo, o peixe e a carne um pouco antes."},{"id":"casa-1-Ficha5","nome":"Frango em pedaços na air fryer","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"20 a 25 min","min":25,"dif":1,"eq":["af"],"prot":["Frango"],"html":"<p><strong>Air fryer, 190 a 195 graus · 20 a 25 min<\/strong><\/p><p><strong>Precisa de:<\/strong> 4 a 6 pedaços de <strong>coxa ou sobrecoxa com osso<\/strong>, de tamanho parecido · sal · alho amassado ou em pó · páprica doce · pimenta-do-reino · fio de óleo neutro · papel toalha · <strong>tábua do cru<\/strong> · pinça · termômetro de espeto · prato limpo pro frango pronto.<\/p><ol><li><strong>Não lave o frango.<\/strong> Seque cada pedaço com papel toalha, dos dois lados. <em>Deu certo:<\/em> a pele está seca ao toque, o papel sai sem molhar.<\/li><li><strong>Tempere na hora:<\/strong> sal leve, alho, páprica, pimenta, e um fio de óleo esfregado com a mão. <strong>Lave a mão agora<\/strong>, antes de tocar no aparelho.<\/li><li><strong>Pré-aqueça a 195 graus<\/strong>, 3 a 5 min.<\/li><li><strong>Na assadeira<\/strong>, pele pra cima, <strong>sem um pedaço encostar no outro<\/strong>. <strong>195 graus, 12 min.<\/strong><\/li><li><strong>Vire com a pinça<\/strong>, com luva. Se usou duas assadeiras, troque de altura agora.<\/li><li><strong>Mais 8 minutos, e confira com o termômetro<\/strong> no pedaço mais grosso, no centro da carne. <em>Deu certo:<\/em> <strong>74 graus ou mais.<\/strong> <em>Falta:<\/em> devolve por 3 a 5 min e mede de novo. <strong>Não sirva pelo olho.<\/strong> Pele dourada não diz nada sobre o centro.<\/li><li><strong>Ponha no prato limpo<\/strong>, nunca no que levou o frango cru. Descanse 5 min.<\/li><li><strong>Lave a tábua, a pinça que tocou no cru e a pia.<\/strong><\/li><\/ol><p><strong>Caderno:<\/strong> quantos minutos levou de verdade, e qual a temperatura no primeiro teste.<\/p>","casa":true,"busca":"frango em pedacos na air fryer air fryer, 190 a 195 graus · 20 a 25 min precisa de: 4 a 6 pedacos de coxa ou sobrecoxa com osso , de tamanho parecido · sal · alho amassado ou em po · paprica doce · pimenta-do-reino · fio de oleo neutro · papel toalha · tabua do cru · pinca · termometro de espeto · prato limpo pro frango pronto. nao lave o frango. seque cada pedaco com papel toalha, dos dois lados. deu certo: a pele esta seca ao toque, o papel sai sem molhar. tempere na hora: sal leve, alho, paprica, pimenta, e um fio de oleo esfregado com a mao. lave a mao agora , antes de tocar no aparelho. pre-aqueca a 195 graus , 3 a 5 min. na assadeira , pele pra cima, sem um pedaco encostar no outro . 195 graus, 12 min. vire com a pinca , com luva. se usou duas assadeiras, troque de altura agora. mais 8 minutos, e confira com o termometro no pedaco mais grosso, no centro da carne. deu certo: 74 graus ou mais. falta: devolve por 3 a 5 min e mede de novo. nao sirva pelo olho. pele dourada nao diz nada sobre o centro. ponha no prato limpo , nunca no que levou o frango cru. descanse 5 min. lave a tabua, a pinca que tocou no cru e a pia. caderno: quantos minutos levou de verdade, e qual a temperatura no primeiro teste."},{"id":"casa-1-Ficha6","nome":"Legumes variados assados na air fryer","cat":["Legumes e sopa"],"fonte":"Ficha da casa","tempo":"12 a 20 min","min":20,"dif":1,"eq":["af"],"prot":["Sem proteína"],"html":"<p><strong>Air fryer, 190 a 200 graus · 12 a 20 min<\/strong><\/p><p><strong>Precisa de:<\/strong> brócolis e couve-flor em floretes (e cenoura se tiver em pedaços pequenos) · 1 colher de sopa de óleo neutro · sal · tigela · pinça.<\/p><ol><li><strong>Lave e SEQUE muito bem<\/strong> com pano limpo ou papel. Legume molhado vira vapor e não doura. <em>Deu certo:<\/em> nenhuma gota visível.<\/li><li><strong>Na tigela, misture os legumes com 1 colher de sopa de óleo<\/strong> e uma pitada de sal. <em>Deu certo:<\/em> todos brilhando por igual, sem poça de óleo no fundo.<\/li><li><strong>Pré-aqueça a 200 graus.<\/strong> <strong>Camada única<\/strong> na assadeira, com espaço. O duro (cenoura) leva mais que o macio (brócolis): se misturar, a cenoura vai em pedaço menor.<\/li><li><strong>200 graus, 8 min. Vire com a pinça.<\/strong><\/li><li><strong>Confira a partir dos 12 min.<\/strong> <em>Deu certo:<\/em> <strong>pontas douradas e levemente tostadas<\/strong>, e o garfo entra no talo com leve resistência. <em>Falta:<\/em> mais 3 min. <strong>Pontas pretas<\/strong> no brócolis antes do talo amaciar: na próxima vez, 190 graus.<\/li><li><strong>Finalize<\/strong> com fio de azeite e limão, fora do aparelho.<\/li><\/ol>","casa":true,"busca":"legumes variados assados na air fryer air fryer, 190 a 200 graus · 12 a 20 min precisa de: brocolis e couve-flor em floretes (e cenoura se tiver em pedacos pequenos) · 1 colher de sopa de oleo neutro · sal · tigela · pinca. lave e seque muito bem com pano limpo ou papel. legume molhado vira vapor e nao doura. deu certo: nenhuma gota visivel. na tigela, misture os legumes com 1 colher de sopa de oleo e uma pitada de sal. deu certo: todos brilhando por igual, sem poca de oleo no fundo. pre-aqueca a 200 graus. camada unica na assadeira, com espaco. o duro (cenoura) leva mais que o macio (brocolis): se misturar, a cenoura vai em pedaco menor. 200 graus, 8 min. vire com a pinca. confira a partir dos 12 min. deu certo: pontas douradas e levemente tostadas , e o garfo entra no talo com leve resistencia. falta: mais 3 min. pontas pretas no brocolis antes do talo amaciar: na proxima vez, 190 graus. finalize com fio de azeite e limao, fora do aparelho."},{"id":"casa-1-Ficha7","nome":"Filé de peixe branco na air fryer","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"8 a 10 min","min":10,"dif":1,"eq":["af"],"prot":["Peixe"],"html":"<p><strong>Air fryer, 190 a 200 graus · 8 a 10 min<\/strong><\/p><p><strong>Precisa de:<\/strong> 2 filés de tilápia ou pescada, de espessura parecida · sal · limão · pimenta-do-reino · fio de óleo · papel toalha · espátula larga · termômetro.<\/p><ol><li><strong>Seque os filés com papel toalha<\/strong>, dos dois lados. <em>Deu certo:<\/em> o papel sai sem molhar.<\/li><li><strong>Tempere:<\/strong> sal leve, pimenta, fio de óleo dos dois lados. O limão vai <strong>no fim<\/strong>, no prato: ácido cru por muito tempo deixa a superfície pastosa.<\/li><li><strong>Pré-aqueça a 190 graus.<\/strong> Filés na assadeira, sem encostar. Peixe magro gruda na grade; um fio de óleo na grade ajuda.<\/li><li><strong>190 graus, 7 minutos. Não vire.<\/strong> Filé fino desmancha na virada.<\/li><li><strong>Confira aos 7 min<\/strong>, termômetro de lado, no meio da parte mais grossa. <em>Deu certo:<\/em> <strong>60 a 63 graus<\/strong>, carne <strong>opaca<\/strong> (deixou de ser translúcida) e, cutucando com garfo, <strong>solta em lascas grandes<\/strong>. <em>Falta:<\/em> translúcido no centro, mais 1 a 2 min. <em>Passou:<\/em> desmancha em farelo. Não tem volta, anote e tire 2 min da próxima vez.<\/li><li><strong>Tire com a espátula larga<\/strong> por baixo do filé inteiro. Limão no prato.<\/li><\/ol><p><strong>A lição desta ficha:<\/strong> com peixe, <strong>1 minuto a mais estraga<\/strong>. Confira cedo, sempre.<\/p>","casa":true,"busca":"file de peixe branco na air fryer air fryer, 190 a 200 graus · 8 a 10 min precisa de: 2 files de tilapia ou pescada, de espessura parecida · sal · limao · pimenta-do-reino · fio de oleo · papel toalha · espatula larga · termometro. seque os files com papel toalha , dos dois lados. deu certo: o papel sai sem molhar. tempere: sal leve, pimenta, fio de oleo dos dois lados. o limao vai no fim , no prato: acido cru por muito tempo deixa a superficie pastosa. pre-aqueca a 190 graus. files na assadeira, sem encostar. peixe magro gruda na grade; um fio de oleo na grade ajuda. 190 graus, 7 minutos. nao vire. file fino desmancha na virada. confira aos 7 min , termometro de lado, no meio da parte mais grossa. deu certo: 60 a 63 graus , carne opaca (deixou de ser translucida) e, cutucando com garfo, solta em lascas grandes . falta: translucido no centro, mais 1 a 2 min. passou: desmancha em farelo. nao tem volta, anote e tire 2 min da proxima vez. tire com a espatula larga por baixo do file inteiro. limao no prato. a licao desta ficha: com peixe, 1 minuto a mais estraga . confira cedo, sempre."},{"id":"casa-1-Ficha8","nome":"Arroz e proteína reaquecidos no micro-ondas","cat":["Sobras"],"fonte":"Ficha da casa","dif":1,"eq":["mo"],"prot":["Sem proteína"],"html":"<p><strong>Micro-ondas, coberto com respiro<\/strong><\/p><p><strong>Antes de começar, a pergunta que decide:<\/strong> essa sobra foi pra geladeira <strong>dentro de 2 horas<\/strong> depois de pronta, e tem <strong>no máximo 3 a 4 dias<\/strong>? Se não, <strong>vai fora<\/strong>, mesmo cheirando bem. Arroz que passou a noite na bancada vai fora sem discussão.<\/p><p><strong>Precisa de:<\/strong> prato fundo de vidro ou cerâmica, tampa de micro-ondas, termômetro.<\/p><ol><li><strong>Camada baixa no prato<\/strong>, arroz de um lado e proteína do outro, com o centro vazio.<\/li><li><strong>Respingue 1 colher de sopa de água no arroz<\/strong> e <strong>cubra com respiro<\/strong>.<\/li><li><strong>1 minuto e meio, e mexa<\/strong>: o que estava na borda vai pro meio. Pedaço grande, vire.<\/li><li><strong>Mais 1 minuto, e descanse 1 minuto coberto.<\/strong><\/li><li><strong>Termômetro em dois pontos:<\/strong> no meio do arroz e no centro do maior pedaço de proteína. <em>Deu certo:<\/em> <strong>74 graus nos dois.<\/strong> <em>Falta em um deles:<\/em> mais 30 s e mede de novo.<\/li><li><strong>Fumegando por igual<\/strong>, não só na borda, é o sinal sem termômetro.<\/li><\/ol>","casa":true,"busca":"arroz e proteina reaquecidos no micro-ondas micro-ondas, coberto com respiro antes de comecar, a perg da xicara na frigideira e deslize o ovo de perto , sem soltar de alto. deu certo: a clara se espalha e comeca a ficar branca nas bordas logo , com um chiado baixo. sem chiado e a clara parada transparente: fogo baixo demais, suba um pouco. chiado forte, borbulha e espirra: alto demais, baixe. nao toque na gema. nao mexa. deixe a clara firmar. acompanhe a clara de fora pra dentro. deu certo: branca e opaca por inteiro , inclusive o anel fino em volta da gema, que e a ultima parte a firmar. a gema continua brilhante e mole. desligue e tire deslizando a espatula por baixo, inteira, ate o prato. tempere no prato: pitada de sal, pimenta. se quiser a gema mais firme: deixe mais tempo em fogo baixo e acompanhe. a clara ja esta pronta; voce esta escolhendo o ponto da gema. caderno: posicao do botao que funcionou, e em quantos minutos a clara ficou branca."},{"id":"casa-2-Ficha2","nome":"Ovo mexido cremoso","cat":["Ovos"],"fonte":"Ficha da casa","dif":1,"eq":["fg"],"prot":["Ovo"],"html":"<p><strong>Frigideira antiaderente · fogo baixo<\/strong><\/p><blockquote><strong>Se está rápido, está errado.<\/strong><\/blockquote><p><strong>Precisa de:<\/strong> 2 ou 3 ovos · 1 colher de sopa de leite ou água · pitada de sal · 1 colher de chá de óleo, azeite ou manteiga · tigela · garfo · espátula de silicone · prato <strong>já separado<\/strong> do lado do fogão.<\/p><ol><li><strong>Bata os ovos na tigela com o leite e o sal<\/strong> até gema e clara virarem uma mistura só. <em>Deu certo:<\/em> amarelo uniforme, sem fio de clara transparente.<\/li><li><strong>Gordura na frigideira fria, fogo baixo<\/strong>, 1 min.<\/li><li><strong>Despeje os ovos.<\/strong> <em>Deu certo:<\/em> nada acontece de imediato. Se a borda firmou na hora, o fogo está alto: baixe.<\/li><li><strong>Mexa sem parar com a espátula<\/strong>, raspando o fundo e trazendo a parte firme pro meio, em movimentos largos. <em>Deu certo:<\/em> aparecem coalhos grandes e macios, não grumos pequenos e secos.<\/li><li><stro
