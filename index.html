rong>Lave<\/strong> o arroz em água corrente, esfregando com a mão. <em>Deu certo:<\/em> a água escorre clara, não leitosa.<\/li><li><strong>Refogue<\/strong> a cebola num fio de óleo em fogo médio. <em>Deu certo:<\/em> cebola translúcida, sem dourar.<\/li><li><strong>Junte o alho<\/strong>, 30 a 60 segundos. <em>Deu certo:<\/em> o cheiro subiu, cor no máximo começando a dourar. Escureceu: recomece.<\/li><li><strong>Junte o arroz escorrido<\/strong> e mexa. <em>Deu certo:<\/em> todos os grãos brilhando de óleo.<\/li><li><strong>Junte a água<\/strong> (1 de arroz pra 2 de água enquanto ainda mede) e o sal (comece com menos de meia colher de chá por xícara de arroz). Folha de louro, se quiser. <em>Deu certo:<\/em> antes de tampar, olhe onde a água ficou. É a imagem que você vai copiar.<\/li><li><strong>Fogo alto<\/strong> até levantar fervura. <em>Deu certo:<\/em> borbulha forte e contínua.<\/li><li><strong>Fogo no mínimo, tampa, e não mexa mais.<\/strong> <em>Deu certo:<\/em> tampa bem assentada, vapor não escapa pela borda.<\/li><li><strong>18 a 20 minutos.<\/strong> <em>Deu certo:<\/em> sem água livre no fundo. Se espiar, uma vez só e rápido.<\/li><li><strong>Desligue e descanse tampado 5 minutos.<\/strong> <em>Deu certo:<\/em> ao soltar com o garfo, os grãos se separam e estão macios por inteiro.<\/li><li><strong>Sobra pra geladeira em até 2 horas<\/strong>, em pote raso.<\/li><\/ol><p><strong>Deu defeito?<\/strong> Empapado: menos água ou mexeu. Cru no meio: pouca água ou tampa vazando. Grudado ou queimado: fogo alto no fim. Seco: pouca água ou tempo demais. Uma variável por vez.<\/p><p><strong>Caderno de bordo:<\/strong> panela, quantidade de arroz, água (medida ou no olho), defeito, o que muda na próxima.<\/p>","casa":true,"busca":"arroz branco antes de ligar o fogo: arroz, cebola picada, alho picado, oleo, sal, agua, a panela, a tampa e a boca do fogao de sempre. tudo na bancada. lave o arroz em agua corrente, esfregando com a mao. deu certo: a agua escorre clara, nao leitosa. refogue a cebola num fio de oleo em fogo medio. deu certo: cebola translucida, sem dourar. junte o alho , 30 a 60 segundos. deu certo: o cheiro subiu, cor no maximo comecando a dourar. escureceu: recomece. junte o arroz escorrido e mexa. deu certo: todos os graos brilhando de oleo. junte a agua (1 de arroz pra 2 de agua enquanto ainda mede) e o sal (comece com menos de meia colher de cha por xicara de arroz). folha de louro, se quiser. deu certo: antes de tampar, olhe onde a agua ficou. e a imagem que voce vai copiar. fogo alto ate levantar fervura. deu certo: borbulha forte e continua. fogo no minimo, tampa, e nao mexa mais. deu certo: tampa bem assentada, vapor nao escapa pela borda. 18 a 20 minutos. deu certo: sem agua livre no fundo. se espiar, uma vez so e rapido. desligue e descanse tampado 5 minutos. deu certo: ao soltar com o garfo, os graos se separam e estao macios por inteiro. sobra pra geladeira em ate 2 horas , em pote raso. deu defeito? empapado: menos agua ou mexeu. cru no meio: pouca agua ou tampa vazando. grudado ou queimado: fogo alto no fim. seco: pouca agua ou tempo demais. uma variavel por vez. caderno de bordo: panela, quantidade de arroz, agua (medida ou no olho), defeito, o que muda na proxima."},{"id":"casa-4-Fichadebancada:feijão","nome":"Feijão na pressão","cat":["Arroz e feijão"],"fonte":"Ficha da casa","dif":2,"eq":["fg","pr"],"prot":["Vegetariano"],"html":"<p><strong>Na noite anterior:<\/strong> feijão de molho em água fria (8 a 12 h).<\/p><ol><li><strong>Escorra<\/strong> e jogue fora a água do molho. <em>Deu certo:<\/em> grão inchado, água do molho descartada.<\/li><li><strong>Ponha o feijão e água limpa na pressão.<\/strong> Nunca acima da <strong>metade<\/strong> da panela. <em>Deu certo:<\/em> nível na metade ou abaixo. Sem sal.<\/li><li><strong>Confira a válvula<\/strong> (desobstruída) e o <strong>anel de borracha<\/strong> (assentado na tampa). Feche. <em>Deu certo:<\/em> tampa travada sem folga.<\/li><li><strong>Fogo<\/strong> até o apito. <em>Deu certo:<\/em> a válvula começou a chiar. <strong>O relógio começa agora.<\/strong><\/li><li><strong>Tempo:<\/strong> carioca 10 a 20 min, preto 15 a 20, fradinho 15 a 20, grão-de-bico 20 a 25. Lentilha: poucos minutos, vigiando.<\/li><li><strong>Desligue e espere a pressão sair sozinha.<\/strong> Nunca force a tampa. <em>Deu certo:<\/em> o vapor parou e a tampa abre sem esforço. Resistiu: ainda tem pressão.<\/li><li><strong>Sacuda de leve pelas alças<\/strong> antes de abrir, ou aperte um grão depois de abrir. <em>Deu certo:<\/em> o grão se desmancha sem resistência. Duro: fecha e volta mais uns minutos.<\/li><li><strong>Refogue cebola e alho à parte<\/strong>, junte uma concha de feijão com caldo, amasse, devolva. <em>Deu certo:<\/em> alho perfumado e não escuro.<\/li><li><strong>Sal agora<\/strong>, pouco, provando. Ferva mais uns minutos com a panela aberta. <em>Deu certo:<\/em> o sabor está no grão, não só no caldo.<\/li><li><strong>Engrossar, se precisar:<\/strong> uma concha de grãos amassada com garfo, de volta, 2 a 3 min. <em>Deu certo:<\/em> o caldo cobre a colher em vez de escorrer.<\/li><li><strong>Sobra pra geladeira em até 2 horas<\/strong>, potes rasos. Congela até 3 meses, frio e com etiqueta.<\/li><\/ol><p><strong>Caderno de bordo:<\/strong> tipo de grão, horas de molho, minutos depois do apito, ponto.<\/p>","casa":true,"busca":"feijao na pressao na noite anterior: feijao de molho em agua fria (8 a 12 h). escorra e jogue fora a agua do molho. deu certo: grao inchado, agua do molho descartada. ponha o feijao e agua limpa na pressao. nunca acima da metade da panela. deu certo: nivel na metade ou abaixo. sem sal. confira a valvula (desobstruida) e o anel de borracha (assentado na tampa). feche. deu certo: tampa travada sem folga. fogo ate o apito. deu certo: a valvula comecou a chiar. o relogio comeca agora. tempo: carioca 10 a 20 min, preto 15 a 20, fradinho 15 a 20, grao-de-bico 20 a 25. lentilha: poucos minutos, vigiando. desligue e espere a pressao sair sozinha. nunca force a tampa. deu certo: o vapor parou e a tampa abre sem esforco. resistiu: ainda tem pressao. sacuda de leve pelas alcas antes de abrir, ou aperte um grao depois de abrir. deu certo: o grao se desmancha sem resistencia. duro: fecha e volta mais uns minutos. refogue cebola e alho a parte , junte uma concha de feijao com caldo, amasse, devolva. deu certo: alho perfumado e nao escuro. sal agora , pouco, provando. ferva mais uns minutos com a panela aberta. deu certo: o sabor esta no grao, nao so no caldo. engrossar, se precisar: uma concha de graos amassada com garfo, de volta, 2 a 3 min. deu certo: o caldo cobre a colher em vez de escorrer. sobra pra geladeira em ate 2 horas , potes rasos. congela ate 3 meses, frio e com etiqueta. caderno de bordo: tipo de grao, horas de molho, minutos depois do apito, ponto."},{"id":"casa-5-Ficha1","nome":"Coxa e sobrecoxa na air fryer","cat":["Carnes e peixes"],"fonte":"Ficha da casa","dif":2,"eq":["af"],"prot":["Frango"],"html":"<p><strong>180 a 200 graus · cerca de 12 min por lado · alvo 74 graus<\/strong><\/p><p><strong>Mise en place:<\/strong> coxas e sobrecoxas com osso, papel toalha, sal, páprica, termômetro, pinça, <strong>tábua da carne crua<\/strong>, prato limpo pra receber o pronto.<\/p><ol><li><strong>Seque cada peça com papel toalha<\/strong> e jogue o papel fora. Não lave o frango. <em>Deu certo se:<\/em> a pele está fosca e seca ao toque, sem líquido escorrendo.<\/li><li><strong>Tempere<\/strong> com sal e páprica, dos dois lados.<\/li><li><strong>Pré-aqueça a air fryer<\/strong> a 190, como na Aula 1.<\/li><li><strong>Peças no cesto, pele pra cima, camada única, com espaço entre elas.<\/strong> <em>Deu certo se:<\/em> nenhuma peça encosta na outra.<\/li><li><strong>12 minutos. Vire com a pinça.<\/strong> <em>Deu certo se:<\/em> o lado de cima já está dourado.<\/li><li><strong>Aos 10 minutos do segundo lado, meça<\/strong> no centro da parte mais grossa, sem encostar no osso. <em>Deu certo se:<\/em> 74 graus ou mais. Menos que isso, mais 3 min e mede de novo.<\/li><li><strong>Antes de medir, aperte e chute:<\/strong> mole, firme, muito firme? Anote. Depois meça.<\/li><li><strong>Pronto vai pro prato limpo.<\/strong> Lave a pinça que tocou o cru antes de usar no pronto.<\/li><\/ol><p><strong>Caderno:<\/strong> tempo real, temperatura final, o que a mão disse.<\/p>","casa":true,"busca":"coxa e sobrecoxa na air fryer 180 a 200 graus · cerca de 12 min por lado · alvo 74 graus mise en place: coxas e sobrecoxas com osso, papel toalha, sal, paprica, termometro, pinca, tabua da carne crua , prato limpo pra receber o pronto. seque cada peca com papel toalha e jogue o papel fora. nao lave o frango. deu certo se: a pele esta fosca e seca ao toque, sem liquido escorrendo. tempere com sal e paprica, dos dois lados. pre-aqueca a air fryer a 190, como na aula 1. pecas no cesto, pele pra cima, camada unica, com espaco entre elas. deu certo se: nenhuma peca encosta na outra. 12 minutos. vire com a pinca. deu certo se: o lado de cima ja esta dourado. aos 10 minutos do segundo lado, meca no centro da parte mais grossa, sem encostar no osso. deu certo se: 74 graus ou mais. menos que isso, mais 3 min e mede de novo. antes de medir, aperte e chute: mole, firme, muito firme? anote. depois meca. pronto vai pro prato limpo. lave a pinca que tocou o cru antes de usar no pronto. caderno: tempo real, temperatura final, o que a mao disse."},{"id":"casa-5-Ficha2","nome":"Bife na frigideira","cat":["Carnes e peixes"],"fonte":"Ficha da casa","dif":2,"eq":["fg"],"prot":["Boi"],"html":"<p><strong>Fogo alto · 3 a 5 min por lado · alvo: o ponto que você escolher, ver tabela<\/strong><\/p><p><strong>Mise en place:<\/strong> bife de contrafilé ou alcatra de 2 a 3 cm, papel toalha, sal, pimenta-do-reino em grão, óleo neutro, frigideira de inox ou ferro, pinça, termômetro, prato limpo.<\/p><ol><li><strong>Escolha o ponto antes de ligar o fogo<\/strong> e anote a temperatura-alvo.<\/li><li><strong>Seque o bife<\/strong> dos dois lados com papel. <em>Deu certo se:<\/em> o papel sai seco na segunda passada.<\/li><li><strong>Sal na hora<\/strong> (ou 45 min a 1 h antes; nunca no meio disso).<\/li><li><strong>Frigideira seca no fogo alto.<\/strong> Pingue uma gota d'água. <em>Deu certo se:<\/em> a gota <strong>dança em bolinha<\/strong>. Se evapora chiando na hora, espere mais.<\/li><li><strong>Fio de óleo, espalhe, e o bife entra<\/strong>, deitando pra longe de você. <em>Deu certo se:<\/em> <strong>chiado forte e contínuo.<\/strong> Chiado fraco, a panela não estava pronta.<\/li><li><strong>Não mexa. 3 minutos.<\/strong> Tente levantar uma borda com a pinça. <em>Deu certo se:<\/em> solta sozinho, com crosta marrom. Grudou? Não está na hora: mais 1 min.<\/li><li><strong>Vire. Baixe pro médio<\/strong> se a crosta já está escura.<\/li><li><strong>Aperte o centro, compare com a mão, chute o ponto.<\/strong> Depois meça no centro, entrando pela lateral. <em>Deu certo se:<\/em> 2 a 3 graus abaixo do alvo: tire. O descanso completa.<\/li><li><strong>Prato limpo, 3 a 5 min de descanso<\/strong>. Pimenta moída na hora, no fim. <em>Deu certo se:<\/em> ao cortar, pouco suco escorre no prato.<\/li><\/ol>","casa":true,"busca":"bife na frigideira fogo alto · 3 a 5 min por lado · alvo: o ponto que voce escolher, ver tabela mise en place: bife de contrafile ou alcatra de 2 a 3 cm, papel toalha, sal, pimenta-do-reino em grao, oleo neutro, frigideira de inox ou ferro, pinca, termometro, prato limpo. escolha o ponto antes de ligar o fogo e anote a temperatura-alvo. seque o bife dos dois lados com papel. deu certo se: o papel sai seco na segunda passada. sal na hora (ou 45 min a 1 h antes; nunca no meio disso). frigideira seca no fogo alto. pingue uma gota d'agua. deu certo se: a gota danca em bolinha . se evapora chiando na hora, espere mais. fio de oleo, espalhe, e o bife entra , deitando pra longe de voce. deu certo se: chiado forte e continuo. chiado fraco, a panela nao estava pronta. nao mexa. 3 minutos. tente levantar uma borda com a pinca. deu certo se: solta sozinho, com crosta marrom. grudou? nao esta na hora: mais 1 min. vire. baixe pro medio se a crosta ja esta escura. aperte o centro, compare com a mao, chute o ponto. depois meca no centro, entrando pela lateral. deu certo se: 2 a 3 graus abaixo do alvo: tire. o descanso completa. prato limpo, 3 a 5 min de descanso . pimenta moida na hora, no fim. deu certo se: ao cortar, pouco suco escorre no prato."},{"id":"casa-5-Ficha3","nome":"Carne moída dourada, e o molho","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"5 a 8 min","min":8,"dif":2,"eq":["fg"],"prot":["Boi"],"html":"<p><strong>Fogo alto, depois baixo · 5 a 8 min dourando · alvo 71 graus<\/strong><\/p><p><strong>Mise en place:<\/strong> 500 g de carne moída, papel toalha, 5 g de sal, <a href=\"#\" class=\"goto\" data-goto=\"r:casa-3-Ficha4\">refogado base<\/a> (cebola e alho picados), tomate picado ou molho de tomate sem sal adicionado, louro, colher de pau, termômetro.<\/p><ol><li><strong>Seque a carne<\/strong> pressionando com papel toalha.<\/li><li><strong>Frigideira grande no fogo alto<\/strong>, teste da gota, fio de óleo.<\/li><li><strong>Carne espalhada em camada.<\/strong> Se não cabe sem amontoar, faça em duas levas. <em>Deu certo se:<\/em> chia forte. Se aparece líquido acumulando, lotou.<\/li><li><strong>Não mexa por 2 a 3 min.<\/strong> <em>Deu certo se:<\/em> levantando com a colher, o fundo está marrom, não cinza.<\/li><li><strong>Agora quebre em pedaços<\/strong> e doure o resto, mexendo pouco. <em>Deu certo se:<\/em> sem caldo no fundo, pedaços dourados e soltos.<\/li><li><strong>Meça num monte de carne:<\/strong> 71 graus.<\/li><li><strong>Reserve a carne num prato.<\/strong> No mesmo fundo, com a gordura que ficou, <strong>faça o <a href=\"#\" class=\"goto\" data-goto=\"r:casa-3-Ficha4\">refogado base<\/a><\/strong>: cebola até translúcida, alho 30 a 60 s.<\/li><li><strong>Devolva a carne, entre o tomate, o louro e o sal.<\/strong><\/li><li><strong>Fogo baixo, 15 a 20 min<\/strong>, mexendo de vez em quando. <em>Deu certo se:<\/em> o molho engrossou e a colher passada no fundo deixa um rastro que demora a fechar.<\/li><\/ol>","casa":true,"busca":"carne moida dourada, e o molho fogo alto, depois baixo · 5 a 8 min dourando · alvo 71 graus mise en place: 500 g de carne moida, papel toalha, 5 g de sal, refogado base (cebola e alho picados), tomate picado ou molho de tomate sem sal adicionado, louro, colher de pau, termometro. seque a carne pressionando com papel toalha. frigideira grande no fogo alto , teste da gota, fio de oleo. carne espalhada em camada. se nao cabe sem amontoar, faca em duas levas. deu certo se: chia forte. se aparece liquido acumulando, lotou. nao mexa por 2 a 3 min. deu certo se: levantando com a colher, o fundo esta marrom, nao cinza. agora quebre em pedacos e doure o resto, mexendo pouco. deu certo se: sem caldo no fundo, pedacos dourados e soltos. meca num monte de carne: 71 graus. reserve a carne num prato. no mesmo fundo, com a gordura que ficou, faca o refogado base : cebola ate translucida, alho 30 a 60 s. devolva a carne, entre o tomate, o louro e o sal. fogo baixo, 15 a 20 min , mexendo de vez em quando. deu certo se: o molho engrossou e a colher passada no fundo deixa um rastro que demora a fechar."},{"id":"casa-5-Ficha4","nome":"Músculo na pressão","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"40 a 50 min","min":50,"dif":2,"eq":["af","fg","pr"],"prot":["Boi"],"html":"<p><strong>Pressão · 40 a 50 min · alvo: desmanchando<\/strong><\/p><p><strong>Mise en place:<\/strong> músculo em pedaços, cebola e alho picados, louro, água, sal.<\/p><p><strong>Antes de tudo, as <a href=\"#\" class=\"goto\" data-goto=\"b:panela-de-pressao-as-travas\">travas da panela de pressão<\/a>:<\/strong> nunca mais de 2/3 da panela, nunca sem líquido, válvula e borracha conferidas, nunca abrir sob pressão.<\/p><ol><li><strong><a href=\"#\" class=\"goto\" data-goto=\"r:casa-3-Ficha4\">Refogado base<\/a> na própria panela de pressão<\/strong>, sem tampa.<\/li><li><strong>Entra o músculo.<\/strong> Selar antes é opcional.<\/li><li><strong>Água e louro.<\/strong> Respeite os 2/3. <em>Deu certo se:<\/em> olhando dentro, sobra pelo menos um terço da panela vazio.<\/li><li><strong>Tampe, fogo alto até pegar pressão<\/strong> (a válvula começa a chiar ou girar,). Baixe o fogo e <strong>conte 40 min a partir daí<\/strong>.<\/li><li><strong>Desligue e espere a pressão sair sozinha.<\/strong> Não force a tampa. <em>Deu certo se:<\/em> a tampa abre sem nenhuma resistência.<\/li><li><strong>Teste com garfo<\/strong> num pedaço grande. <em>Deu certo se:<\/em> a carne <strong>desfia<\/strong> sem esforço. Resistiu? Tampa de novo, mais 10 min de pressão.<\/li><li><strong>Sal só agora<\/strong>, aos poucos, provando.<\/li><\/ol><p><strong>O contraste que esta aula ensina:<\/strong> este corte na air fryer seria borracha. Aqui, com tempo e água, o colágeno virou gelatina.<\/p>","casa":true,"busca":"musculo na pressao pressao · 40 a 50 min · alvo: desmanchando mise en place: musculo em pedacos, cebola e alho picados, louro, agua, sal. antes de tudo, as travas da panela de pressao : nunca mais de 2/3 da panela, nunca sem liquido, valvula e borracha conferidas, nunca abrir sob pressao. refogado base na propria panela de pressao , sem tampa. entra o musculo. selar antes e opcional. agua e louro. respeite os 2/3. deu certo se: olhando dentro, sobra pelo menos um terco da panela vazio. tampe, fogo alto ate pegar pressao (a valvula comeca a chiar ou girar,). baixe o fogo e conte 40 min a partir dai . desligue e espere a pressao sair sozinha. nao force a tampa. deu certo se: a tampa abre sem nenhuma resistencia. teste com garfo num pedaco grande. deu certo se: a carne desfia sem esforco. resistiu? tampa de novo, mais 10 min de pressao. sal so agora , aos poucos, provando. o contraste que esta aula ensina: este corte na air fryer seria borracha. aqui, com tempo e agua, o colageno virou gelatina."},{"id":"casa-5-Ficha5","nome":"Peito de frango com salmoura","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"7 min","min":7,"dif":2,"eq":["af"],"prot":["Frango"],"html":"<p><strong>Air fryer 190 · 7 min, vira, mais 2 a 3 · alvo 74 graus<\/strong><\/p><p><strong>Mise en place:<\/strong> 1 peito, 1 litro de água fria, 50 g de sal (balança), pote que vá à geladeira, papel toalha, termômetro, pinça, tábua da carne crua.<\/p><ol><li><strong>Dissolva os 50 g de sal no litro de água.<\/strong> <em>Deu certo se:<\/em> mexendo, não sobra sal no fundo.<\/li><li><strong>Nivele o peito:<\/strong> abra em borboleta ou corte em pedaços de tamanho igual. <em>Deu certo se:<\/em> a parte mais fina e a mais grossa têm espessura parecida.<\/li><li><strong>Peito na salmoura, pote fechado, geladeira, 30 min a 2 h.<\/strong> Nunca na bancada.<\/li><li><strong>Tire, jogue a salmoura fora e seque muito bem.<\/strong> Não salgue de novo. <em>Deu certo se:<\/em> a superfície está seca ao toque.<\/li><li><strong>Air fryer pré-aquecida a 190. Camada única. 7 min.<\/strong> Vire.<\/li><li><strong>Aperte, compare com a mão, chute.<\/strong> Mais 2 min e meça na parte mais grossa. <em>Deu certo se:<\/em> 74. Faltou, mais 1 min e mede de novo. Peito passa rápido: de minuto em minuto.<\/li><li><strong>Descanso de 3 min<\/strong> no prato limpo. <em>Deu certo se:<\/em> fatiado, o centro está branco e úmido, não fibroso e seco.<\/li><\/ol>","casa":true,"busca":"peito de frango com salmoura air fryer 190 · 7 min, vira, mais 2 a 3 · alvo 74 graus mise en place: 1 peito, 1 litro de agua fria, 50 g de sal (balanca), pote que va a geladeira, papel toalha, termometro, pinca, tabua da carne crua. dissolva os 50 g de sal no litro de agua. deu certo se: mexendo, nao sobra sal no fundo. nivele o peito: abra em borboleta ou corte em pedacos de tamanho igual. deu certo se: a parte mais fina e a mais grossa tem espessura parecida. peito na salmoura, pote fechado, geladeira, 30 min a 2 h. nunca na bancada. tire, jogue a salmoura fora e seque muito bem. nao salgue de novo. deu certo se: a superficie esta seca ao toque. air fryer pre-aquecida a 190. camada unica. 7 min. vire. aperte, compare com a mao, chute. mais 2 min e meca na parte mais grossa. deu certo se: 74. faltou, mais 1 min e mede de novo. peito passa rapido: de minuto em minuto. descanso de 3 min no prato limpo. deu certo se: fatiado, o centro esta branco e umido, nao fibroso e seco."},{"id":"casa-5-Ficha6","nome":"Filé de peixe na air fryer","cat":["Carnes e peixes"],"fonte":"Ficha da casa","tempo":"8 a 10 min","min":10,"dif":2,"eq":["af"],"prot":["Peixe"],"html":"<p><strong>180 a 200 graus · 8 a 10 min · tirar entre 60 e 63<\/strong><\/p><p><strong>Mise en place:<\/strong> filé de tilápia ou pescada, conferido nos 5 sinais de frescor na compra, papel toalha, sal, azeite, limão, termômetro, espátula larga.<\/p><ol><li><strong>Seque o filé<\/strong> com papel, com delicadeza: ele rasga fácil.<\/li><li><strong>Sal e fio de azeite<\/strong> dos dois lados.<\/li><li><strong>Air fryer pré-aquecida.<\/strong> Filé deitado, sem sobrepor.<\/li><li><strong>Aos 6 min, olhe<\/strong>. <em>Deu certo se:<\/em> a borda já ficou branca e opaca.<\/li><li><strong>Meça no centro da parte mais grossa.<\/strong> <em>Deu certo se:<\/em> entre 60 e 63. O calor residual sobe mais 2 ou 3. Tire.<\/li><li><strong>Teste do garfo<\/strong>, de leve, na borda. <em>Deu certo se:<\/em> solta em <strong>lascas grandes<\/strong>. Farelo é sinal de que passou: na próxima, tire 1 a 2 min antes.<\/li><li><strong>Limão por cima só agora<\/strong>, fora do fogo.<\/li><\/ol><p><strong>Caderno:<\/strong> quantos minutos o seu filé levou, e com que espessura.<\/p>","casa":true,"busca":"file de peixe na air fryer 180 a 200 graus · 8 a 10 min · tirar entre 60 e 63 mise en place: file de tilapia ou pescada, conferido nos 5 sinais de frescor na compra, papel toalha, sal, azeite, limao, termometro, espatula larga. seque o file com papel, com delicadeza: ele rasga facil. sal e fio de azeite dos dois lados. air fryer pre-aquecida. file deitado, sem sobrepor. aos 6 min, olhe . deu certo se: a borda ja ficou branca e opaca. meca no centro da parte mais grossa. deu certo se: entre 60 e 63. o calor residual sobe mais 2 ou 3. tire. teste do garfo , de leve, na borda. deu certo se: solta em lascas grandes . farelo e sinal de que passou: na proxima, tire 1 a 2 min antes. limao por cima so agora , fora do fogo. caderno: quantos minutos o seu file levou, e com que espessura."},{"id":"casa-6-Ficha6.1","nome":"Legume na fervura, com choque térmico","cat":["Legumes e sopa"],"fonte":"Ficha da casa","dif":2,"eq":["fg"],"prot":["Sem proteína"],"html":"<p><strong>Mise en place:<\/strong> legume cortado em pedaços do mesmo tamanho · panela grande com água · tigela com água e gelo ao lado do fogão · escumadeira (a colher grande furada) · timer.<\/p><ol><li><strong>Encha a panela e ligue em fogo alto.<\/strong> Sinal: bolha grande e contínua, que não para quando você mexe.<\/li><li><strong>Monte a tigela de gelo antes do legume entrar.<\/strong> Sinal: gelo ainda inteiro boiando na água.<\/li><li><strong>Legume na água fervendo, timer ligado<\/strong> pelo tempo da categoria (<a href=\"#\" class=\"goto\" data-goto=\"b:ponto-do-legume\">tabela das cinco categorias<\/a>). Sinal: a fervura diminui por alguns segundos e volta. Se não voltar, era legume demais pra panela.<\/li><li><strong>Um minuto antes do fim, teste o maior pedaço<\/strong> com a ponta da faca. Sinal: entra sem força e encontra resistência leve no centro.<\/li><li><strong>Tire com a escumadeira direto pro gelo.<\/strong> Sinal: a cor fica mais viva em segundos.<\/li><li><strong>Deixe no gelo até o centro esfriar<\/strong>, e escorra. Sinal: o pedaço maior está frio ao toque por dentro, ao partir.<\/li><li><strong>Prove sem sal, depois com uma pitada e limão.<\/strong> Anote no caderno a diferença.<\/li><\/ol><p><strong>Deu errado?<\/strong> Papa por fora e cru por dentro: entrou em água que não fervia, ou os pedaços eram de tamanhos diferentes.<\/p>","casa":true,"busca":"legume na fervura, com choque termico mise en place: legume cortado em pedacos do mesmo tamanho · panela grande com agua · tigela com agua e gelo ao lado do fogao · escumadeira (a colher grande furada) · timer. encha a panela e ligue em fogo alto. sinal: bolha grande e continua, que nao para quando voce mexe. monte a tigela de gelo antes do legume entrar. sinal: gelo ainda inteiro boiando na agua. legume na agua fervendo, timer ligado pelo tempo da categoria ( tabela das cinco categorias ). sinal: a fervura diminui por alguns segundos e volta. se nao voltar, era legume demais pra panela. um minuto antes do fim, teste o maior pedaco com a ponta da faca. sinal: entra sem forca e encontra resistencia leve no centro. tire com a escumadeira direto pro gelo. sinal: a cor fica mais viva em segundos. deixe no gelo ate o centro esfriar , e escorra. sinal: o pedaco maior esta frio ao toque por dentro, ao partir. prove sem sal, depois com uma pitada e limao. anote no caderno a diferenca. deu errado? papa por fora e cru por dentro: entrou em agua que nao fervia, ou os pedacos eram de tamanhos diferentes."},{"id":"casa-6-Ficha6.2","nome":"Legume assado na air fryer","cat":["Legumes e sopa"],"fonte":"Ficha da casa","dif":1,"eq":["af"],"prot":["Sem proteína"],"html":"<p><strong>Mise en place:<\/strong> legume cortado em pedaços do mesmo tamanho · papel toalha · fio de óleo · sal e um tempero seco da <a href=\"#\" class=\"goto\" data-goto=\"b:tempero\">tabela de afinidade<\/a> · tigela pra misturar.<\/p><ol><li><strong>Pré-aqueça a air fryer a 190 a 200 graus.<\/strong> Sinal: o aparelho indica que atingiu a temperatura.<\/li><li><strong>Seque o legume com papel toalha.<\/strong> Sinal: o papel sai sem molhar. Superfície molhada não doura.<\/li><li><strong>Na tigela, legume, fio de óleo, sal em pouca quantidade e o tempero seco.<\/strong> Mexa. Sinal: todos os pedaços brilham por igual, sem poça de óleo no fundo.<\/li><li><strong>No cesto em camada única, sem encostar uns nos outros.<\/strong> Sinal: dá pra ver o fundo do cesto entre os pedaços. Lotou, faz em duas levas.<\/li><li><strong>12 a 20 minutos, sacudindo o cesto na metade.<\/strong> Raiz dura fica no limite de cima, legume-fruto no de baixo. Sinal: bordas douradas e a faca entra com resistência leve.<\/li><li><strong>Prove antes de servir<\/strong> e passe pela sequência: sal, ácido, gordura, calor.<\/li><\/ol><p><strong>Tubérculo na air fryer:<\/strong> Prefira o ponto al dente e não deixe passar.<\/p>","casa":true,"busca":"legume assado na air fryer mise en place: legume cortado em pedacos do mesmo tamanho · papel toalha · fio de oleo · sal e um tempero seco da tabela de afinidade · tigela pra misturar. pre-aqueca a air fryer a 190 a 200 graus. sinal: o aparelho indica que atingiu a temperatura. seque o legume com papel toalha. sinal: o papel sai sem molhar. superficie molhada nao doura. na tigela, legume, fio de oleo, sal em pouca quantidade e o tempero seco. mexa. sinal: todos os pedacos brilham por igual, sem poca de oleo no fundo. no cesto em camada unica, sem encostar uns nos outros. sinal: da pra ver o fundo do cesto entre os pedacos. lotou, faz em duas levas. 12 a 20 minutos, sacudindo o cesto na metade. raiz dura fica no limite de cima, legume-fruto no de baixo. sinal: bordas douradas e a faca entra com resistencia leve. prove antes de servir e passe pela sequencia: sal, acido, gordura, calor. tuberculo na air fryer: prefira o ponto al dente e nao deixe passar."},{"id":"casa-6-Ficha6.3","nome":"Sopa sem receita","cat":["Legumes e sopa"],"fonte":"Ficha da casa","dif":2,"eq":["fg","pr"],"prot":["Sem proteína"],"html":"<p><strong>Mise en place:<\/strong> cebola e alho picados · legumes em cubo médio, separados por categoria · um ingrediente de corpo (batata, mandioquinha ou abóbora) · água quente na chaleira · liquidificador ou mixer · limão e cebolinha pra finalizar.<\/p><ol><li><strong>Refogue cebola na gordura em fogo médio-baixo.<\/strong> Sinal: cebola translúcida, não dourada.<\/li><li><strong>Alho, 30 a 60 segundos.<\/strong> Sinal: o cheiro sobe e a cor começa a dourar de leve. Escureceu, recomece.<\/li><li><strong>Tempero seco, se houver, por 30 segundos na gordura.<\/strong> Sinal: perfuma. Não deixe escurecer.<\/li><li><strong>Entram os legumes mais duros primeiro, depois a água cobrindo dois dedos acima.<\/strong> Uma pitada de sal aqui, a primeira camada. Sinal: a superfície do líquido fica dois dedos acima do legume mais alto.<\/li><li><strong>Ferva com tampa entreaberta.<\/strong> Os legumes mais macios entram no meio do caminho. Sinal: o pedaço mais duro desmancha ao ser apertado contra a parede da panela com a colher. Panela comum, 15 a 25 minutos; pressão, 8.<\/li><li><strong>Corpo: bata uma ou duas conchas<\/strong> e devolva. Sinal: a colher sai coberta por uma camada fina e opaca, e o líquido não escorre como água.<\/li><li><strong>Prove e ajuste no fim:<\/strong> sal, depois limão, depois um fio de azeite. Sinal: você consegue dizer qual dos três mudou o gosto.<\/li><li><strong>Cebolinha fora do fogo, na hora de servir.<\/strong><\/li><\/ol><p><strong>Sobrou?<\/strong> Pote raso, geladeira em até 2 horas. Vai congelar? <strong>Congele sem a batata<\/strong>: ela fica arenosa no freezer.<\/p>","casa":true,"busca":"sopa sem receita mise en place: cebola e alho picados · legumes em cubo medio, separados por categoria · um ingrediente de corpo (batata, mandioquinha ou abobora) · agua quente na chaleira · liquidificador ou mixer · limao e cebolinha pra finalizar. refogue cebola na gordura em fogo medio-baixo. sinal: cebola translucida, nao dourada. alho, 30 a 60 segundos. sinal: o cheiro sobe e a cor comeca a dourar de leve. escureceu, recomece. tempero seco, se houver, por 30 segundos na gordura. sinal: perfuma. nao deixe escurecer. entram os legumes mais duros primeiro, depois a agua cobrindo dois dedos acima. uma pitada de sal aqui, a primeira camada. sinal: a superficie do liquido fica dois dedos acima do legume mais alto. ferva com tampa entreaberta. os legumes mais macios entram no meio do caminho. sinal: o pedaco mais duro desmancha ao ser apertado contra a parede da panela com a colher. panela comum, 15 a 25 minutos; pressao, 8. corpo: bata uma ou duas conchas e devolva. sinal: a colher sai coberta por uma camada fina e opaca, e o liquido nao escorre como agua. prove e ajuste no fim: sal, depois limao, depois um fio de azeite. sinal: voce consegue dizer qual dos tres mudou o gosto. cebolinha fora do fogo, na hora de servir. sobrou? pote raso, geladeira em ate 2 horas. vai congelar? congele sem a batata : ela fica arenosa no freezer."},{"id":"casa-6-Ficha6.4","nome":"Diagnóstico do prato sem graça","cat":["Técnica"],"fonte":"Ficha da casa","dif":1,"prot":["Sem proteína"],"html":"<p><strong>Use em qualquer prato pronto, antes de pegar o saleiro.<\/strong> Talher limpo a cada prova.<\/p><ol><li><strong>Prove uma colher e responda: tem gosto de alguma coisa?<\/strong> Não tem gosto nenhum: falta sal. Uma pitada, mexa, prove de novo. Sinal: os outros sabores aparecem. Se só apareceu gosto de sal, era outra coisa: pare de salgar.<\/li><li><strong>O sal está certo, mas parece pesado ou morto?<\/strong> Falta ácido. Algumas gotas de limão ou vinagre num cantinho, mexa, prove. Sinal: o prato \"acorda\", parece mais leve.<\/li><li><strong>Seco na boca, ou o sabor some rápido?<\/strong> Falta gordura. Um fio de azeite. Sinal: o sabor fica mais tempo na boca.<\/li><li><strong>Os três ajustados e ainda sem graça?<\/strong> Falta calor. Na próxima vez, doure mais o refogado ou a proteína. Agora, dá pra dourar à parte um pouco de cebola e juntar.<\/li><li><strong>Anote no caderno qual dos quatro resolveu.<\/strong> É esse registro que treina o paladar.<\/li><\/ol><p><strong>Ordem é tudo nesta ficha.<\/strong> Pular direto pro sal é o vício que ela existe pra quebrar.<\/p>","casa":true,"busca":"diagnostico do prato sem graca use em qualquer prato pronto, antes de pegar o saleiro. talher limpo a cada prova. prove uma colher e responda: tem gosto de alguma coisa? nao tem gosto nenhum: falta sal. uma pitada, mexa, prove de novo. sinal: os outros sabores aparecem. se so apareceu gosto de sal, era outra coisa: pare de salgar. o sal esta certo, mas parece pesado ou morto? falta acido. algumas gotas de limao ou vinagre num cantinho, mexa, prove. sinal: o prato \"acorda\", parece mais leve. seco na boca, ou o sabor some rapido? falta gordura. um fio de azeite. sinal: o sabor fica mais tempo na boca. os tres ajustados e ainda sem graca? falta calor. na proxima vez, doure mais o refogado ou a proteina. agora, da pra dourar a parte um pouco de cebola e juntar. anote no caderno qual dos quatro resolveu. e esse registro que treina o paladar. ordem e tudo nesta ficha. pular direto pro sal e o vicio que ela existe pra quebrar."},{"id":"casa-7-Ficha7.1","nome":"Guardar a sobra do arroz (e de tudo)","cat":["Sobras"],"fonte":"Ficha da casa","dif":1,"eq":["fg"],"prot":["Sem proteína"],"html":"<p><strong>Vale em toda cozinhada.<\/strong> Separar a sobra é a última etapa do preparo, não a primeira da limpeza.<\/p><ol><li><strong>Antes de servir, separe a porção do jantar<\/strong> direto da panela pros potes. Sinal: a panela vai pra mesa já com a quantidade do almoço só.<\/li><li><strong>Potes rasos, camada de menos de 5 cm.<\/strong> Sinal: a camada de comida fica abaixo da largura de três dedos deitados. Na dúvida, mais potes e menos altura.<\/li><li><strong>Destampe uns minutos pra sair o vapor.<\/strong> Sinal: o vapor visível parou de subir.<\/li><li><strong>Tampe, etiquete se for pro freezer, e geladeira.<\/strong> Arroz: <strong>em até 1 hora<\/strong> depois de pronto. O resto: até 2 horas. Sinal: anote a hora em que desligou o fogo.<\/li><li><strong>Na hora de comer, tire só a porção do prato.<\/strong> Sinal: o pote volta pra geladeira na hora, sem ficar na mesa.<\/li><li><strong>Reaqueça até sair vapor do meio<\/strong>, uma vez. Termômetro: 74 graus no centro. Sinal: fumega no meio, não só na borda.<\/li><\/ol><p><strong>Arroz esquecido a noite na bancada: lixo. Sem exceção, sem reaquecer pra ver.<\/strong><\/p>","casa":true,"busca":"guardar a sobra do arroz (e de tudo) vale em toda cozinhada. separar a sobra e a ultima etapa do preparo, nao a primeira da limpeza. antes de servir, separe a porcao do jantar direto da panela pros potes. sinal: a panela vai pra mesa ja com a quantidade do almoco so. potes rasos, camada de menos de 5 cm. sinal: a camada de comida fica abaixo da largura de tres dedos deitados. na duvida, mais potes e menos altura. destampe uns minutos pra sair o vapor. sinal: o vapor visivel parou de subir. tampe, etiquete se for pro freezer, e geladeira. arroz: em ate 1 hora depois de pronto. o resto: ate 2 horas. sinal: anote a hora em que desligou o fogo. na hora de comer, tire so a porcao do prato. sinal: o pote volta pra geladeira na hora, sem ficar na mesa. reaqueca ate sair vapor do meio , uma vez. termometro: 74 graus no centro. sinal: fumega no meio, nao so na borda. arroz esquecido a noite na bancada: lixo. sem excecao, sem reaquecer pra ver."},{"id":"casa-7-Ficha7.2","nome":"Fórmula-mãe: sobra vira prato","cat":["Sobras"],"fonte":"Ficha da casa","dif":2,"eq":["af","fg","fo"],"prot":["Sem proteína"],"html":"<p><strong>Antes de ligar qualquer coisa, preencha de cabeça ou no caderno:<\/strong><\/p><div class=\"tw\"><table><tr><th>Papel<\/th><th>O que eu tenho<\/th><\/tr><tr><td>Base<\/td><td><\/td><\/tr><tr><td>Ligante<\/td><td><\/td><\/tr><tr><td>Por cima<\/td><td><\/td><\/tr><\/table><\/div><p><strong>Versão A, arroz de forno:<\/strong><\/p><ol><li><strong>Arroz da geladeira, frio.<\/strong> Sinal: os grãos estão firmes e separados, não quentes.<\/li><li><strong>2 partes de arroz pra 1 de ligante<\/strong> (ovo batido, requeijão ou molho branco). Misture. Sinal: todo grão envolvido, sem poça de líquido no fundo.<\/li><li><strong>Proteína ou legume picado no meio.<\/strong> Sinal: pedaços menores que uma noz.<\/li><li><strong>Travessa, queijo ou farinha de rosca por cima.<\/strong> Sinal: a superfície coberta.<\/li><li><strong>Forno ou air fryer<\/strong>. Sinal de pronto: <strong>74 graus no centro da travessa<\/strong> no termômetro, e a cobertura derretida e dourada. O termômetro manda, a cor não.<\/li><\/ol><p><strong>Versão B, omelete de sobra:<\/strong><\/p><ol><li><strong>2 a 3 ovos por pessoa<\/strong>, batidos com uma pitada de sal. Sinal: cor uniforme, sem fio de clara.<\/li><li><strong>Sobra picada pequena<\/strong>, misturada nos ovos. Sinal: nenhum pedaço maior que uma ervilha grande. Pedaço grande desmonta a omelete.<\/li><li><strong>Frigideira com gordura, fogo médio-baixo, já quente<\/strong>, entra a mistura. Sinal: a borda começa a firmar em segundos, sem chiar alto.<\/li><li><strong>Deixe a base firmar antes de dobrar<\/strong> (como na <a href=\"#\" class=\"goto\" data-goto=\"r:casa-2-Ficha4\">omelete<\/a>). Sinal: sacudindo a frigideira, a omelete desliza inteira.<\/li><li><strong>Dobre e sirva sem dourar demais.<\/strong><\/li><\/ol>","casa":true,"busca":"formula-mae: sobra vira prato antes de ligar qualquer coisa, preencha de cabeca ou no caderno: papel o que eu tenho base ligante por cima versao a, arroz de forno: arroz da geladeira, frio. sinal: os graos estao firmes e separados, nao quentes. 2 partes de arroz pra 1 de ligante (ovo batido, requeijao ou molho branco). misture. sinal: todo grao envolvido, sem poca de liquido no fundo. proteina ou legume picado no meio. sinal: pedacos menores que uma noz. travessa, queijo ou farinha de rosca por cima. sinal: a superficie coberta. forno ou air fryer . sinal de pronto: 74 graus no centro da travessa no termometro, e a cobertura derretida e dourada. o termometro manda, a cor nao. versao b, omelete de sobra: 2 a 3 ovos por pessoa , batidos com uma pitada de sal. sinal: cor uniforme, sem fio de clara. sobra picada pequena , misturada nos ovos. sinal: nenhum pedaco maior que uma ervilha grande. pedaco grande desmonta a omelete. frigideira com gordura, fogo medio-baixo, ja quente , entra a mistura. sinal: a borda comeca a firmar em segundos, sem chiar alto. deixe a base firmar antes de dobrar (como na omelete ). sinal: sacudindo a frigideira, a omelete desliza inteira. dobre e sirva sem dourar demais."},{"id":"casa-7-Ficha7.3","nome":"Farofa","cat":["Acompanhamentos"],"fonte":"Ficha da casa","dif":2,"eq":["fg"],"prot":["Sem proteína"],"html":"<p><strong>Mise en place:<\/strong> 2 xícaras de farinha de mandioca crua · cerca de 4 colheres de sopa generosas de manteiga · cebola picada · colher de pau · timer.<\/p><ol><li><strong>Manteiga na frigideira em fogo baixo.<\/strong> Sinal: derrete e borbulha devagar. Escureceu ou cheirou queimado: fogo alto demais, recomece.<\/li><li><strong>Cebola até ficar translúcida.<\/strong> Sinal: transparente nas bordas, sem dourar.<\/li><li><strong>Farinha aos poucos, mexendo sempre.<\/strong> Sinal: cada leva é absorvida pela gordura antes da próxima entrar.<\/li><li><strong>Timer em 8 minutos, fogo baixo, sem parar de mexer.<\/strong> Sinal: cheiro de tostado e cor levemente dourada. Até 12 minutos se ainda tiver cheiro de farinha crua.<\/li><li><strong>Prove.<\/strong> Sinal: crocante e com gosto de tostado, não de farinha crua. Arenosa na boca, mais um ou dois minutos.<\/li><li><strong>Desligue e finalize fora do fogo<\/strong>, mexendo pouco. Sal só agora, provando.<\/li><\/ol><p><strong>Pra virar tropeiro:<\/strong> com a farofa pronta e o fogo baixíssimo ou desligado, entra o feijão <strong>escorrido<\/strong>, por último, mexendo pouco. Sinal: grãos inteiros e farofa ainda solta. Empapou, era caldo demais ou fogo demais.<\/p>","casa":true,"busca":"farofa mise en place: 2 xicaras de farinha de mandioca crua · cerca de 4 colheres de sopa generosas de manteiga · cebola picada · colher de pau · timer. manteiga na frigideira em fogo baixo. sinal: derrete e borbulha devagar. escureceu ou cheirou queimado: fogo alto demais, recomece. cebola ate ficar translucida. sinal: transparente nas bordas, sem dourar. farinha aos poucos, mexendo sempre. sinal: cada leva e absorvida pela gordura antes da proxima entrar. timer em 8 minutos, fogo baixo, sem parar de mexer. sinal: cheiro de tostado e cor levemente dourada. ate 12 minutos se ainda tiver cheiro de farinha crua. prove. sinal: crocante e com gosto de tostado, nao de farinha crua. arenosa na boca, mais um ou dois minutos. desligue e finalize fora do fogo , mexendo pouco. sal so agora, provando. pra virar tropeiro: com a farofa pronta e o fogo baixissimo ou desligado, entra o feijao escorrido , por ultimo, mexendo pouco. sinal: graos inteiros e farofa ainda solta. empapou, era caldo demais ou fogo demais."},{"id":"casa-7-Ficha7.4","nome":"Lote de domingo, 4 componentes em até 3 horas","cat":["Técnica"],"fonte":"Ficha da casa","dif":3,"eq":["af","fg","pr","fo"],"prot":["Sem proteína"],"html":"<p><strong>Mise en place, na véspera:<\/strong> cardápio dos 4 componentes decidido · feijão de molho (8 a 12 horas; <a href=\"#\" class=\"goto\" data-goto=\"r:casa-4-Fichadebancada:feijão\">ficha do feijão<\/a>) · potes rasos limpos · fita crepe e caneta · espaço livre na geladeira e no freezer.<\/p><ol><li><strong>Hora 0: ligue o que se cuida sozinho.<\/strong> Feijão na pressão, arroz no fogo. Sinal: as duas bocas ocupadas antes de você pegar a faca.<\/li><li><strong>Proteína temperada e no forno ou na air fryer.<\/strong> Pouco tempero, pra ser versátil. Sinal: três coisas cozinhando e você com as mãos livres.<\/li><li><strong>Pique e cozinhe os legumes<\/strong> (<a href=\"#\" class=\"goto\" data-goto=\"r:casa-6-Ficha6.1\">fervura com choque<\/a> ou <a href=\"#\" class=\"goto\" data-goto=\"r:casa-6-Ficha6.2\">assados na air fryer<\/a>). Sinal: o legume sai al dente, porque vai ser reaquecido.<\/li><li><strong>Confira a proteína no termômetro<\/strong> (74 no frango, 71 na moída, 63 no corte inteiro). Sinal: o número, não o relógio.<\/li><li><strong>Esfrie tudo em pote raso<\/strong>, ou em banho de gelo se for volume grande. Sinal: nenhum pote fumegando quando a tampa entra.<\/li><li><strong>Etiquete: nome e data.<\/strong> Sinal: nenhum pote sem fita.<\/li><li><strong>Distribua:<\/strong> geladeira pro que vai até quinta, freezer pro resto. <strong>Arroz da semana vai pro freezer em porções.<\/strong> Sinal: na geladeira só arroz pra 1 dia.<\/li><li><strong>Olhe o relógio e anote no caderno<\/strong> quanto levou e qual etapa travou. Sinal de passagem: dentro de 3 horas.<\/li><\/ol>","casa":true,"busca":"lote de domingo, 4 componentes em ate 3 horas mise en place, na vespera: cardapio dos 4 componentes decidido · feijao de molho (8 a 12 horas; ficha do feijao ) · potes rasos limpos · fita crepe e caneta · espaco livre na geladeira e no freezer. hora 0: ligue o que se cuida sozinho. feijao na pressao, arroz no fogo. sinal: as duas bocas ocupadas antes de voce pegar a faca. proteina temperada e no forno ou na air fryer. pouco tempero, pra ser versatil. sinal: tres coisas cozinhando e voce com as maos livres. pique e cozinhe os legumes ( fervura com choque ou assados na air fryer ). sinal: o legume sai al dente, porque vai ser reaquecido. confira a proteina no termometro (74 no frango, 71 na moida, 63 no corte inteiro). sinal: o numero, nao o relogio. esfrie tudo em pote raso , ou em banho de gelo se for volume grande. sinal: nenhum pote fumegando quando a tampa entra. etiquete: nome e data. sinal: nenhum pote sem fita. distribua: geladeira pro que vai ate quinta, freezer pro resto. arroz da semana vai pro freezer em porcoes. sinal: na geladeira so arroz pra 1 dia. olhe o relogio e anote no caderno quanto levou e qual etapa travou. sinal de passagem: dentro de 3 horas."},{"id":"casa-8-Ficha8.2","nome":"Molho de carne com redução","cat":["Carnes e peixes"],"fonte":"Ficha da casa","dif":2,"eq":["fg"],"prot":["Boi"],"html":"<p><strong>Mise en place:<\/strong> carne moída seca com papel toalha · cebola e alho picados · tomate ou extrato de tomate · água quente · louro · colher de pau · termômetro.<\/p><ol><li><strong>Panela bem quente, carne seca, sem lotar.<\/strong> Sinal: chia forte ao encostar. Se o chiado some, lotou.<\/li><li><strong>Não mexa por 2 a 3 minutos.<\/strong> Sinal: crosta marrom no fundo antes de quebrar.<\/li><li><strong>Quebre e doure até 71 graus.<\/strong> Sinal: o termômetro, em mais de um ponto. Reserve a carne.<\/li><li><strong>No mesmo fundo, cebola, depois alho<\/strong>, na gordura que sobrou. Sinal: cebola translúcida, alho perfumado e mal dourando.<\/li><li><strong>Devolva a carne, entram tomate, louro e o líquido.<\/strong> Sinal: líquido cobrindo a carne.<\/li><li><strong>Fogo baixo, destampado, 15 a 20 minutos.<\/strong> Sinal: o molho cobre a colher e não escorre como água.<\/li><li><strong>Sal só agora<\/strong>, provando. Depois a sequência: falta ácido? Sinal: você sabe dizer qual elemento ajustou.<\/li><\/ol>","casa":true,"busca":"molho de carne com reducao mise en place: carne moida seca com papel toalha · cebola e alho picados · tomate ou extrato de tomate · agua quente · louro · colher de pau · termometro. panela bem quente, carne seca, sem lotar. sinal: chia forte ao encostar. se o chiado some, lotou. nao mexa por 2 a 3 minutos. sinal: crosta marrom no fundo antes de quebrar. quebre e doure ate 71 graus. sinal: o termometro, em mais de um ponto. reserve a carne. no mesmo fundo, cebola, depois alho , na gordura que sobrou. sinal: cebola translucida, alho perfumado e mal dourando. devolva a carne, entram tomate, louro e o liquido. sinal: liquido cobrindo a carne. fogo baixo, destampado, 15 a 20 minutos. sinal: o molho cobre a colher e nao escorre como agua. sal so agora , provando. depois a sequencia: falta acido? sinal: voce sabe dizer qual elemento ajustou."},{"id":"casa-8-Ficha8.3","nome":"Frango inteiro no forno","cat":["Carnes e peixes"],"fonte":"Ficha da casa","dif":3,"eq":["fo"],"prot":["Frango"],"html":"<p><strong>Mise en place (na véspera):<\/strong> frango inteiro · recipiente que caiba na geladeira · 50 g de sal por litro de água suficiente pra cobrir · papel toalha · assadeira · termômetro.<\/p><ol><li><strong>Salmoura na geladeira, 8 a 12 horas.<\/strong> Sinal: o frango inteiro submerso.<\/li><li><strong>Tire, descarte a salmoura, seque muito bem.<\/strong> Sinal: o papel sai sem molhar. Pele molhada não doura. Não lave o frango.<\/li><li><strong>Forno pré-aquecido a 180 graus.<\/strong> Sinal: o forno indica que atingiu a temperatura.<\/li><li><strong>Asse 1 h a 1 h 20.<\/strong> Aos 50 minutos, primeira leitura. Sinal: ainda abaixo de 74, segue.<\/li><li><strong>Meça no peito E na coxa, na parte mais grossa.<\/strong> Sinal: <strong>74 nos dois<\/strong>. Um só não vale.<\/li><li><strong>Descanso de 10 a 15 minutos<\/strong> antes de cortar. Sinal: ao cortar, o suco fica na carne e não forma poça no prato.<\/li><li><strong>Sobra:<\/strong> pote raso em até 2 horas. Frango desfiado é a sobra mais versátil: vira prato pela <a href=\"#\" class=\"goto\" data-goto=\"r:casa-7-Ficha7.2\">fórmula-mãe da sobra<\/a>.<\/li><\/ol>","casa":true,"busca":"frango inteiro no forno mise en place (na vespera): frango inteiro · recipiente que caiba na geladeira · 50 g de sal por litro de agua suficiente pra cobrir · papel toalha · assadeira · termometro. salmoura na geladeira, 8 a 12 horas. sinal: o frango inteiro submerso. tire, descarte a salmoura, seque muito bem. sinal: o papel sai sem molhar. pele molhada nao doura. nao lave o frango. forno pre-aquecido a 180 graus. sinal: o forno indica que atingiu a temperatura. asse 1 h a 1 h 20. aos 50 minutos, primeira leitura. sinal: ainda abaixo de 74, segue. meca no peito e na coxa, na parte mais grossa. sinal: 74 nos dois . um so nao vale. descanso de 10 a 15 minutos antes de cortar. sinal: ao cortar, o suco fica na carne e nao forma poca no prato. sobra: pote raso em ate 2 horas. frango desfiado e a sobra mais versatil: vira prato pela formula-mae da sobra ."},{"id":"risoto-base","nome":"Risoto base de parmesão","cat":["Risoto"],"fonte":"Panelinha (base adaptada)","url":"https://panelinha.com.br/receita/risoto-de-aspargos-e-parmesao","tempo":"cerca de 35 min","min":35,"dif":2,"sal":"atenção","eq":["af","fg"],"prot":["Vegetariano"],"html":"<p><strong>4 porções · cerca de 35 min no fogão · fogão, duas bocas<\/strong><\/p><p>Base: a receita do Panelinha, sem o aspargo. As outras duas fontes servem de conferência.<\/p><h4>O que muda em relação ao arroz que você já faz<\/h4><p>No arroz comum você põe toda a água, tampa e <strong>não mexe<\/strong>. No risoto é o contrário: o caldo entra <strong>aos poucos<\/strong>, a panela fica <strong>destampada<\/strong> e você <strong>mexe<\/strong>. Mexer solta o amido da casca do grão, e é esse amido que vira o creme. Por isso o risoto pede arroz próprio: o grão é mais curto e tem mais amido.<\/p><p><strong>Palavras desta ficha:<\/strong><\/p><ul><li><strong>Al dente:<\/strong> cozido por fora, com um pontinho firme no meio do grão quando você morde. Não é cru: é durinho, não duro.<\/li><li><strong>Mantecar:<\/strong> o fim do risoto. Com o fogo <strong>desligado<\/strong>, você junta manteiga e queijo e mexe com vigor até virar creme.<\/li><li><strong>Caldo quente:<\/strong> o caldo fica numa segunda panela, em fogo baixo, o tempo todo. Caldo frio faz o arroz parar de cozinhar a cada concha.<\/li><\/ul><h4>Antes de ligar o fogo<\/h4><p>Tudo na bancada, medido:<\/p><div class=\"tw\"><table><tr><th>Item<\/th><th>Quanto<\/th><\/tr><tr><td>Arroz para risoto (arbóreo ou carnaroli, vem escrito no pacote)<\/td><td>2 xícaras (400 g)<\/td><\/tr><tr><td>Caldo de legumes caseiro <strong>sem sal<\/strong><\/td><td>1,5 litro<\/td><\/tr><tr><td>Cebola, picada miúda<\/td><td>½<\/td><\/tr><tr><td>Azeite<\/td><td>2 colheres (sopa)<\/td><\/tr><tr><td>Vinho branco seco<\/td><td>½ xícara<\/td><\/tr><tr><td>Manteiga<\/td><td>3 colheres (sopa)<\/td><\/tr><tr><td>Parmesão ralado<\/td><td>¾ de xícara<\/td><\/tr><tr><td>Sal e pimenta<\/td><td>pouco: o parmesão já salga<\/td><\/tr><\/table><\/div><p><strong>Caldo de cubo, não.<\/strong> O Panelinha usa caldo caseiro, e avisa que caldo caseiro não leva sal. Sem caldo caseiro pronto, água quente funciona, com menos sabor.<\/p><p><strong>Sem vinho?<\/strong> As três fontes usam vinho. Se não tiver, pule o passo 4 e entre direto com o caldo.<\/p><p>Equipamento: panela larga de fundo grosso, panela pequena pro caldo, concha, colher de pau.<\/p><h4>Passo a passo<\/h4><ol><li><strong>Caldo no fogo baixo<\/strong>, na boca de trás, e lá fica até o fim. <em>Deu certo se:<\/em> fumega sem ferver forte.<\/li><li><strong>Cebola no azeite<\/strong>, fogo médio, na panela larga. <em>Deu certo se:<\/em> fica transparente, sem dourar (é o <a href=\"#\" class=\"goto\" data-goto=\"r:casa-3-Ficha4\">refogado base<\/a>).<\/li><li><strong>Junte o arroz seco, sem lavar<\/strong>, e mexa 2 minutos. Tempere com uma pitada de sal e pimenta. <em>Deu certo se:<\/em> os grãos ficam brilhantes, cobertos de gordura, e as pontas começam a ficar translúcidas. <em>Por que não lavar:<\/em> lavar tira o amido que vai fazer o creme.<\/li><li><strong>Vinho<\/strong>, mexendo, até secar. <em>Deu certo se:<\/em> não tem mais líquido no fundo e o cheiro forte de álcool sumiu.<\/li><li><strong>Duas conchas de caldo<\/strong>, mexa de vez em quando e espere secar. Repita. <em>Deu certo se:<\/em> ao passar a colher no fundo, abre um caminho que demora a fechar. Aí é hora da próxima concha. <em>Fogo:<\/em> médio. Se o caldo some em menos de um minuto, abaixe.<\/li><li><strong>Aos 15 minutos de caldo, prove um grão.<\/strong> Daí em diante, prove a cada concha. <em>Deu certo se:<\/em> chegou ao al dente, em geral entre 17 e 20 minutos de caldo. <strong>Pode sobrar caldo:<\/strong> o ponto é o grão, não acabar o litro e meio.<\/li><li><strong>Última concha, mexa e DESLIGUE o fogo.<\/strong> Junte manteiga e parmesão e mexa com vigor. <em>Deu certo se:<\/em> fica cremoso e úmido. Na colher, escorre devagar, não fica em bloco. Se ficou firme, mais um pouco de caldo quente.<\/li><li><strong>Prove o sal só agora<\/strong>, depois do parmesão. <strong>Sirva na hora.<\/strong><\/li><\/ol><p><strong>Deu defeito?<\/strong><\/p><ul><li><strong>Grão duro no meio e caldo acabou:<\/strong> água quente, concha por concha.<\/li><li><strong>Virou papa:<\/strong> passou do ponto. Na próxima, comece a provar mais cedo.<\/li><li><strong>Seco, empelotado:<\/strong> faltou caldo no fim, ou esperou pra servir.<\/li><li><strong>Grão cozido mas sem creme:<\/strong> mexeu pouco, ou o arroz não era de risoto.<\/li><\/ul><h4>Depois<\/h4><ul><li><strong>Risoto não espera.<\/strong> Feito, vai pro prato. Parado, endurece.<\/li><li><strong>A sobra segue a regra do arroz<\/strong> (<a href=\"#\" class=\"goto\" data-goto=\"r:casa-7-Ficha7.1\">ficha de guardar a sobra<\/a>): geladeira em até 1 hora, pote raso, reaquecer uma vez só. Ou vira bolinho de arroz na air fryer, ou canja (<a href=\"#\" class=\"goto\" data-goto=\"r:risoto-7\">canja de sobra de risoto<\/a>).<\/li><\/ul><p><strong>Caderno de bordo:<\/strong> marca do arroz, quanto caldo usou, em que minuto deu o ponto, como ficou o creme.<\/p><h4>Como variar<\/h4><p><strong>A regra que vale pra todas:<\/strong> o esqueleto é sempre o da ficha acima (refogado, arroz 2 minutos, vinho, caldo aos poucos, mantecar com o fogo desligado). O que muda é <strong>o que entra e em que momento<\/strong>. Só três momentos existem:<\/p><div class=\"tw\"><table><tr><th>Momento<\/th><th>O que costuma entrar ali<\/th><\/tr><tr><td><strong>No refogado<\/strong>, antes do arroz<\/td><td>Alho-poró, salsão, gengibre, aspargo: o que dá cheiro e precisa amolecer<\/td><\/tr><tr><td><strong>No meio do caldo<\/strong><\/td><td>O que cozinha rápido, como a ponta do aspargo<\/td><\/tr><tr><td><strong>No fim<\/strong>, com o fogo desligado<\/td><td>O que já está pronto (abóbora assada, cogumelo dourado, camarão, frango) e o que perde o frescor no fogo (raspas de limão)<\/td><\/tr><\/table><\/div>","casa":true,"busca":"risoto base de parmesao 4 porcoes · cerca de 35 min no fogao · fogao, duas bocas base: a receita do panelinha, sem o aspargo. as outras duas fontes servem de conferencia. o que muda em relacao ao arroz que voce ja faz no arroz comum voce poe toda a agua, tampa e nao mexe . no risoto e o contrario: o caldo entra aos poucos , a panela fica destampada e voce mexe . mexer solta o amido da casca do grao, e e esse amido que vira o creme. por isso o risoto pede arroz proprio: o grao e mais curto e tem mais amido. palavras desta ficha: al dente: cozido por fora, com um pontinho firme no meio do grao quando voce morde. nao e cru: e durinho, nao duro. mantecar: o fim do risoto. com o fogo desligado , voce junta manteiga e queijo e mexe com vigor ate virar creme. caldo quente: o caldo fica numa segunda panela, em fogo baixo, o tempo todo. caldo frio faz o arroz parar de cozinhar a cada concha. antes de ligar o fogo tudo na bancada, medido: item quanto arroz para risoto (arboreo ou carnaroli, vem escrito no pacote) 2 xicaras (400 g) caldo de legumes caseiro sem sal 1,5 litro cebola, picada miuda ½ azeite 2 colheres (sopa) vinho branco seco ½ xicara manteiga 3 colheres (sopa) parmesao ralado ¾ de xicara sal e pimenta pouco: o parmesao ja salga caldo de cubo, nao. o panelinha usa caldo caseiro, e avisa que caldo caseiro nao leva sal. sem caldo caseiro pronto, agua quente funciona, com menos sabor. sem vinho? as tres fontes usam vinho. se nao tiver, pule o passo 4 e entre direto com o caldo. equipamento: panela larga de fundo grosso, panela pequena pro caldo, concha, colher de pau. passo a passo caldo no fogo baixo , na boca de tras, e la fica ate o fim. deu certo se: fumega sem ferver forte. cebola no azeite , fogo medio, na panela larga. deu certo se: fica transparente, sem dourar (e o refogado base ). junte o arroz seco, sem lavar , e mexa 2 minutos. tempere com uma pitada de sal e pimenta. deu certo se: os graos ficam brilhantes, cobertos de gordura, e as pontas comecam a ficar translucidas. por que nao lavar: lavar tira o amido que vai fazer o creme. vinho , mexendo, ate secar. deu certo se: nao tem mais liquido no fundo e o cheiro forte de alcool sumiu. duas conchas de caldo , mexa de vez em quando e espere secar. repita. deu certo se: ao passar a colher no fundo, abre um caminho que demora a fechar. ai e hora da proxima concha. fogo: medio. se o caldo some em menos de um minuto, abaixe. aos 15 minutos de caldo, prove um grao. dai em diante, prove a cada concha. deu certo se: chegou ao al dente, em geral entre 17 e 20 minutos de caldo. pode sobrar caldo: o ponto e o grao, nao acabar o litro e meio. ultima concha, mexa e desligue o fogo. junte manteiga e parmesao e mexa com vigor. deu certo se: fica cremoso e umido. na colher, escorre devagar, nao fica em bloco. se ficou firme, mais um pouco de caldo quente. prove o sal so agora , depois do parmesao. sirva na hora. deu defeito? grao duro no meio e caldo acabou: agua quente, concha por concha. virou papa: passou do ponto. na proxima, comece a provar mais cedo. seco, empelotado: faltou caldo no fim, ou esperou pra servir. grao cozido mas sem creme: mexeu pouco, ou o arroz nao era de risoto. depois risoto nao espera. feito, vai pro prato. parado, endurece. a sobra segue a regra do arroz ( ficha de guardar a sobra ): geladeira em ate 1 hora, pote raso, reaquecer uma vez so. ou vira bolinho de arroz na air fryer, ou canja ( canja de sobra de risoto ). caderno de bordo: marca do arroz, quanto caldo usou, em que minuto deu o ponto, como ficou o creme. como variar a regra que vale pra todas: o esqueleto e sempre o da ficha acima (refogado, arroz 2 minutos, vinho, caldo aos poucos, mantecar com o fogo desligado). o que muda e o que entra e em que momento . so tres momentos existem: momento o que costuma entrar ali no refogado , antes do arroz alho-poro, salsao, gengibre, aspargo: o que da cheiro e precisa amolecer no meio do caldo o que cozinha rapido, como a ponta do aspargo no fim , com o fogo desligado o que ja esta pronto (abobora assada, cogumelo dourado, camarao, frango) e o que perde o frescor no fogo (raspas de limao)"},{"id":"risoto-1","nome":"Risoto de aspargo e parmesão","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-de-aspargos-e-parmesao","dif":1,"sal":"atenção","eq":["fg"],"prot":["Vegetariano"],"html":"<p>A receita original de onde saiu a base.<\/p><ul><li><strong>Entra:<\/strong> 400 g de aspargo fresco.<\/li><li><strong>Refogado:<\/strong> o aspargo vai com a cebola, 2 minutos, antes do arroz. Separe as pontas.<\/li><li><strong>Meio do caldo:<\/strong> aos 10 minutos de caldo entram as pontas, e segue mais 7 a 8 minutos.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de aspargo e parmesao a receita original de onde saiu a base. entra: 400 g de aspargo fresco. refogado: o aspargo vai com a cebola, 2 minutos, antes do arroz. separe as pontas. meio do caldo: aos 10 minutos de caldo entram as pontas, e segue mais 7 a 8 minutos."},{"id":"risoto-2","nome":"Risoto de abóbora com sálvia","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-de-abobora-e-salvia","dif":1,"sal":"atenção","eq":["fg","fo"],"prot":["Vegetariano"],"html":"<ul><li><strong>Entra:<\/strong> 700 g de abóbora japonesa em cubos de 2,5 cm, sem sementes e sem fibras · 10 folhas de sálvia · o parmesão cai pra 4 colheres (sopa).<\/li><li><strong>Antes de tudo:<\/strong> a fonte assa a abóbora no forno com azeite, sal, pimenta e a sálvia, 40 min a 180 °C.<\/li><li><strong>Fim:<\/strong> a abóbora e o suco que ficou na assadeira entram no risoto, depois o parmesão.<\/li><li><strong>Atenção:<\/strong> na última concha, não deixe o caldo secar todo. O ponto é cremoso.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de abobora com salvia entra: 700 g de abobora japonesa em cubos de 2,5 cm, sem sementes e sem fibras · 10 folhas de salvia · o parmesao cai pra 4 colheres (sopa). antes de tudo: a fonte assa a abobora no forno com azeite, sal, pimenta e a salvia, 40 min a 180 °c. fim: a abobora e o suco que ficou na assadeira entram no risoto, depois o parmesao. atencao: na ultima concha, nao deixe o caldo secar todo. o ponto e cremoso."},{"id":"risoto-3","nome":"Risoto de limão-siciliano","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-cremoso-limao-siciliano","dif":2,"sal":"atenção","eq":["fg"],"prot":["Vegetariano"],"html":"<ul><li><strong>Entra:<\/strong> 1 alho-poró · 1 talo de salsão · 1 gema · raspas e suco de 1 limão-siciliano · 1 xícara de parmesão · 2 colheres (sopa) de manteiga · 1 limão-siciliano em rodelas, pra grelhar.<\/li><li><strong>Antes:<\/strong> numa tigela, misture a gema, as raspas, o suco e o parmesão.<\/li><li><strong>Refogado:<\/strong> salsão, cebola e alho-poró, cerca de 3 minutos.<\/li><li><strong>Fim, fogo desligado:<\/strong> a manteiga e a mistura da tigela. <strong>A mistura fica com cara de talhada, e é assim mesmo<\/strong> (a fonte avisa).<\/li><li><strong>Rodelas:<\/strong> grelhadas 2 minutos de cada lado, por cima na hora de servir.<\/li><li><strong>Atenção ao sal:<\/strong> é a que leva mais parmesão. Use ¾ de xícara, como na base.<\/li><li>Rende até 6 porções na fonte.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de limao-siciliano entra: 1 alho-poro · 1 talo de salsao · 1 gema · raspas e suco de 1 limao-siciliano · 1 xicara de parmesao · 2 colheres (sopa) de manteiga · 1 limao-siciliano em rodelas, pra grelhar. antes: numa tigela, misture a gema, as raspas, o suco e o parmesao. refogado: salsao, cebola e alho-poro, cerca de 3 minutos. fim, fogo desligado: a manteiga e a mistura da tigela. a mistura fica com cara de talhada, e e assim mesmo (a fonte avisa). rodelas: grelhadas 2 minutos de cada lado, por cima na hora de servir. atencao ao sal: e a que leva mais parmesao. use ¾ de xicara, como na base. rende ate 6 porcoes na fonte."},{"id":"risoto-4","nome":"Risoto de cogumelos","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-de-cogumelos-com-salsinha","dif":2,"sal":"atenção","eq":["fg"],"prot":["Vegetariano"],"html":"<ul><li><strong>Entra:<\/strong> 600 g de cogumelos, misturando shiitake, shimeji e paris (200 g de cada) · 1 dente de alho.<\/li><li><strong>Os cogumelos:<\/strong> frigideira bem quente, <strong>um tipo por vez<\/strong>, com o alho. Dourado, sai da frigideira.<\/li><li><strong>Fim:<\/strong> os cogumelos entram no risoto pronto.<\/li><li><strong>A fonte faz diferente:<\/strong> pré-cozinha o arroz na véspera e finaliza em 5 minutos. Pra primeira vez, fazer na sequência da ficha base é mais simples. A fonte não leva manteiga nem parmesão; com eles, segue o fim da base.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de cogumelos entra: 600 g de cogumelos, misturando shiitake, shimeji e paris (200 g de cada) · 1 dente de alho. os cogumelos: frigideira bem quente, um tipo por vez , com o alho. dourado, sai da frigideira. fim: os cogumelos entram no risoto pronto. a fonte faz diferente: pre-cozinha o arroz na vespera e finaliza em 5 minutos. pra primeira vez, fazer na sequencia da ficha base e mais simples. a fonte nao leva manteiga nem parmesao; com eles, segue o fim da base."},{"id":"risoto-5","nome":"Risoto de frango","cat":["Risoto"],"fonte":"TudoGostoso","url":"https://www.tudogostoso.com.br/receita/147209-risoto-de-frango.html","dif":2,"sal":"atenção","eq":["fg","pr"],"prot":["Frango"],"html":"<ul><li><strong>Entra:<\/strong> 4 coxas com sobrecoxa · 1 caixa de polpa de tomate · manjerona.<\/li><li><strong>Antes:<\/strong> a fonte cozinha o frango 15 min na pressão, em bastante água, desfia, e usa essa água como caldo.<\/li><li><strong>Refogado:<\/strong> o frango desfiado e a polpa de tomate entram junto com o arroz.<\/li><li><strong>Fim:<\/strong> queijo e manjerona.<\/li><li><strong>Cozinhe o frango sem cubo<\/strong>, com cebola e alho, e a água vira um caldo caseiro. A página aceita arroz branco comum; com arroz de risoto fica mais cremoso.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de frango entra: 4 coxas com sobrecoxa · 1 caixa de polpa de tomate · manjerona. antes: a fonte cozinha o frango 15 min na pressao, em bastante agua, desfia, e usa essa agua como caldo. refogado: o frango desfiado e a polpa de tomate entram junto com o arroz. fim: queijo e manjerona. cozinhe o frango sem cubo , com cebola e alho, e a agua vira um caldo caseiro. a pagina aceita arroz branco comum; com arroz de risoto fica mais cremoso."},{"id":"risoto-6","nome":"Risoto de camarão, alho-poró e laranja","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-de-camarao-alho-poro-e-laranja","dif":3,"sal":"atenção","eq":["fg"],"prot":["Frutos do mar"],"html":"<p><strong>Não é pra primeira vez.<\/strong> É a mais trabalhosa das sete.<\/p><ul><li><strong>Entra:<\/strong> 500 g de camarão limpo e sem a tripa · 1 alho-poró · 1 colher (sopa) de gengibre · ½ xícara de suco de laranja · raspas de 1 laranja-baía · 4 colheres (sopa) de manteiga.<\/li><li><strong>Caldo:<\/strong> a fonte faz um caldo de camarão sem sal com 1 kg de camarão com casca, 40 min.<\/li><li><strong>Refogado:<\/strong> alho-poró 3 minutos, depois o gengibre 1 minuto.<\/li><li><strong>Meio:<\/strong> o suco de laranja entra depois do vinho, antes do caldo.<\/li><li><strong>Camarão:<\/strong> dourado à parte, cerca de 1 minuto por lado, vai pro risoto no fim.<\/li><li><strong>Fim, fogo desligado:<\/strong> raspas e manteiga.<\/li><li><strong>Atenção ao sal:<\/strong> a fonte pede 2 colheres (chá) de sal e ela mesma diz que parece muito. Comece com pouco e prove.<\/li><li>Rende 6 porções.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de camarao, alho-poro e laranja nao e pra primeira vez. e a mais trabalhosa das sete. entra: 500 g de camarao limpo e sem a tripa · 1 alho-poro · 1 colher (sopa) de gengibre · ½ xicara de suco de laranja · raspas de 1 laranja-baia · 4 colheres (sopa) de manteiga. caldo: a fonte faz um caldo de camarao sem sal com 1 kg de camarao com casca, 40 min. refogado: alho-poro 3 minutos, depois o gengibre 1 minuto. meio: o suco de laranja entra depois do vinho, antes do caldo. camarao: dourado a parte, cerca de 1 minuto por lado, vai pro risoto no fim. fim, fogo desligado: raspas e manteiga. atencao ao sal: a fonte pede 2 colheres (cha) de sal e ela mesma diz que parece muito. comece com pouco e prove. rende 6 porcoes."},{"id":"risoto-7","nome":"Canja de sobra de risoto","cat":["Risoto","Sobras"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/canja-de-risoto","dif":1,"sal":"atenção","eq":["fg"],"prot":["Frango"],"html":"<p>Não é risoto: é o destino da sobra.<\/p><ul><li><strong>Entra:<\/strong> 2 xícaras de sobra de risoto · 1 filé de peito de frango · ½ cebola · ½ xícara de cenoura ralada · ¼ de xícara de salsão · 1 litro de água · 1½ colher (sopa) de manteiga.<\/li><li><strong>Como:<\/strong> cebola 5 min; cenoura e salsão mais 5. Frango e água, ferve, 10 min. Desfia o frango, devolve, entra o risoto por 2 min e serve.<\/li><li><strong>Atenção:<\/strong> a sobra de risoto segue a regra do arroz. Geladeira em até 1 hora, e essa é a única reaquecida dela.<\/li><li>Rende até 4 porções.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"canja de sobra de risoto nao e risoto: e o destino da sobra. entra: 2 xicaras de sobra de risoto · 1 file de peito de frango · ½ cebola · ½ xicara de cenoura ralada · ¼ de xicara de salsao · 1 litro de agua · 1½ colher (sopa) de manteiga. como: cebola 5 min; cenoura e salsao mais 5. frango e agua, ferve, 10 min. desfia o frango, devolve, entra o risoto por 2 min e serve. atencao: a sobra de risoto segue a regra do arroz. geladeira em ate 1 hora, e essa e a unica reaquecida dela. rende ate 4 porcoes."},{"id":"risoto-8","nome":"Risoto de filé mignon","cat":["Risoto"],"fonte":"Receitinha da Vovó","url":"https://receitinhadavovo.com.br/risoto-de-file-mignon/","dif":1,"sal":"atenção","eq":["fg"],"prot":["Boi"],"html":"<p>O mais fácil dos com proteína: sela, reserva, volta no fim.<\/p><ul><li><strong>Entra:<\/strong> 400 g de filé mignon em cubinhos · ½ xícara de parmesão · 2 colheres (sopa) de manteiga · 3 de azeite. A fonte usa 1½ xícara de arroz e 1 litro de caldo, pra 4 porções.<\/li><li><strong>Antes:<\/strong> tempere a carne com sal e pimenta e doure em 1 colher de manteiga e 1 de azeite, <strong>fogo alto, sem mexer até dourar<\/strong> (dica da fonte). Reserve.<\/li><li><strong>Fim:<\/strong> a carne volta quando o arroz está quase al dente. Manteiga e parmesão no final.<\/li><li><strong>A fonte se contradiz:<\/strong> a lista pede vinho tinto, a dica fala em branco. Use o branco da base.<\/li><li><strong>Variação da mesma carne<\/strong> (TudoGostoso, com gorgonzola): leva 400 g de gorgonzola pra 5 porções.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de file mignon o mais facil dos com proteina: sela, reserva, volta no fim. entra: 400 g de file mignon em cubinhos · ½ xicara de parmesao · 2 colheres (sopa) de manteiga · 3 de azeite. a fonte usa 1½ xicara de arroz e 1 litro de caldo, pra 4 porcoes. antes: tempere a carne com sal e pimenta e doure em 1 colher de manteiga e 1 de azeite, fogo alto, sem mexer ate dourar (dica da fonte). reserve. fim: a carne volta quando o arroz esta quase al dente. manteiga e parmesao no final. a fonte se contradiz: a lista pede vinho tinto, a dica fala em branco. use o branco da base. variacao da mesma carne (tudogostoso, com gorgonzola): leva 400 g de gorgonzola pra 5 porcoes."},{"id":"risoto-9","nome":"Risoto de pera com gorgonzola","cat":["Risoto"],"fonte":"TudoGostoso","url":"https://www.tudogostoso.com.br/receita/114161-risoto-de-gorgonzola-e-pera.html","dif":1,"sal":"atenção","eq":["fg"],"prot":["Vegetariano"],"html":"<ul><li><strong>Entra:<\/strong> 3 peras · 4 colheres (sopa) de mel · 120 g de gorgonzola · 50 g de parmesão · 3 colheres (sopa) de manteiga. A fonte usa 300 g de arroz e 1 litro de caldo, pra 4 porções.<\/li><li><strong>Antes:<\/strong> as peras assam 15 min no mel.<\/li><li><strong>Fim:<\/strong> com o arroz pronto, metade do gorgonzola e a pera. Fogo desligado, manteiga e parmesão, tampa 2 minutos. O resto do gorgonzola vai por cima no prato.<\/li><li><strong>Por que esta e não a outra:<\/strong> a do Guia da Cozinha usa 1½ xícara de gorgonzola e 2 cubos de caldo. Esta usa bem menos queijo. O mel é açúcar adicionado: 4 colheres pra 4 porções.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de pera com gorgonzola entra: 3 peras · 4 colheres (sopa) de mel · 120 g de gorgonzola · 50 g de parmesao · 3 colheres (sopa) de manteiga. a fonte usa 300 g de arroz e 1 litro de caldo, pra 4 porcoes. antes: as peras assam 15 min no mel. fim: com o arroz pronto, metade do gorgonzola e a pera. fogo desligado, manteiga e parmesao, tampa 2 minutos. o resto do gorgonzola vai por cima no prato. por que esta e nao a outra: a do guia da cozinha usa 1½ xicara de gorgonzola e 2 cubos de caldo. esta usa bem menos queijo. o mel e acucar adicionado: 4 colheres pra 4 porcoes."},{"id":"risoto-10","nome":"Risoto de presunto de parma","cat":["Risoto"],"fonte":"TudoGostoso e Pão de Açúcar","url":"https://www.tudogostoso.com.br/receita/89711-risoto-de-presunto-parma-da-familia-gondolo.html","urls":[["Pão de Açúcar","https://content.paodeacucar.com/prazer-de-comer-e-beber/risoto-de-presunto-parma-parmesao"]],"dif":1,"sal":"atenção","eq":["fg"],"prot":["Porco"],"html":"<ul><li><strong>Entra:<\/strong> 150 g de presunto de parma em tiras · 150 g de champignon fresco · tomate seco (1 vidro pequeno; o óleo dele vai no refogado) · 100 g de parmesão. A fonte usa 300 g de arroz pra 4 porções.<\/li><li><strong>Fim, fogo desligado:<\/strong> presunto, champignon, tomate seco, manteiga e parmesão. Tampa 5 minutos. <strong>O presunto não vai ao fogo<\/strong>: entra cru e o calor do arroz amacia.<\/li><li><strong>Sal:<\/strong> nenhum. A própria autora avisa que o presunto já salga.<\/li><li><strong>Cortado da fonte:<\/strong> os 2,5 tabletes de caldo de bacon (caldo caseiro no lugar). A fonte leva também 200 ml de creme de leite e 100 g de manteiga; a base usa 3 colheres de manteiga e fica cremosa sem o creme.<\/li><li><strong>Mais leve:<\/strong> a versão do Pão de Açúcar usa só presunto, parmesão e sálvia, com o presunto rasgado à mão no fim e manteiga gelada com o fogo desligado. É a mais simples de todas.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de presunto de parma entra: 150 g de presunto de parma em tiras · 150 g de champignon fresco · tomate seco (1 vidro pequeno; o oleo dele vai no refogado) · 100 g de parmesao. a fonte usa 300 g de arroz pra 4 porcoes. fim, fogo desligado: presunto, champignon, tomate seco, manteiga e parmesao. tampa 5 minutos. o presunto nao vai ao fogo : entra cru e o calor do arroz amacia. sal: nenhum. a propria autora avisa que o presunto ja salga. cortado da fonte: os 2,5 tabletes de caldo de bacon (caldo caseiro no lugar). a fonte leva tambem 200 ml de creme de leite e 100 g de manteiga; a base usa 3 colheres de manteiga e fica cremosa sem o creme. mais leve: a versao do pao de acucar usa so presunto, parmesao e salvia, com o presunto rasgado a mao no fim e manteiga gelada com o fogo desligado. e a mais simples de todas."},{"id":"risoto-11","nome":"Risoto de cordeiro com hortelã e cominho","cat":["Risoto"],"fonte":"Revista Sabores do Sul","url":"https://revistasaboresdosul.com.br/risoto-de-cordeiro-com-hortela/","dif":2,"sal":"atenção","eq":["fg"],"prot":["Cordeiro e outras"],"html":"<p>O mais perto de tempero árabe que tem fonte aberta.<\/p><ul><li><strong>Entra, por pessoa:<\/strong> 70 g de cordeiro <strong>já cozido e desfiado<\/strong> (sobra de cordeiro assado serve) · 2 g de cominho (cerca de 1 colher de chá rasa) · ½ maço de hortelã · tomate · 50 g de parmesão. A fonte calcula 100 g de arroz e 400 ml de caldo por pessoa.<\/li><li><strong>Refogado:<\/strong> alho e cebola, depois o cordeiro com o cominho, e só então o arroz.<\/li><li><strong>Fim:<\/strong> tomate e parmesão.<\/li><li><strong>Por cima:<\/strong> óleo de hortelã, que é hortelã batida com azeite.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de cordeiro com hortela e cominho o mais perto de tempero arabe que tem fonte aberta. entra, por pessoa: 70 g de cordeiro ja cozido e desfiado (sobra de cordeiro assado serve) · 2 g de cominho (cerca de 1 colher de cha rasa) · ½ maco de hortela · tomate · 50 g de parmesao. a fonte calcula 100 g de arroz e 400 ml de caldo por pessoa. refogado: alho e cebola, depois o cordeiro com o cominho, e so entao o arroz. fim: tomate e parmesao. por cima: oleo de hortela, que e hortela batida com azeite."},{"id":"risoto-12","nome":"Risoto de pato com cogumelos","cat":["Risoto"],"fonte":"Teleculinária","url":"https://teleculinaria.pt/?p=102838","dif":2,"sal":"atenção","eq":["fg"],"prot":["Cordeiro e outras"],"html":"<ul><li><strong>Entra:<\/strong> 2 pernas de pato · cogumelos (paris ou outro) · 100 g de parmesão · raspa de limão · 50 g de manteiga. A fonte usa 200 g de arroz.<\/li><li><strong>Antes, 1 hora:<\/strong> pernas temperadas com sal, pimenta e limão, douradas com a pele pra baixo, depois 1 hora a 180 °C, tampadas. Desfie metade pro risoto e sirva o resto por cima.<\/li><li><strong>Fim:<\/strong> cogumelos salteados à parte entram com o pato, depois manteiga e parmesão.<\/li><li>Texto de Portugal: \"q.b.\" é \"quanto baste\", ou seja, a gosto.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de pato com cogumelos entra: 2 pernas de pato · cogumelos (paris ou outro) · 100 g de parmesao · raspa de limao · 50 g de manteiga. a fonte usa 200 g de arroz. antes, 1 hora: pernas temperadas com sal, pimenta e limao, douradas com a pele pra baixo, depois 1 hora a 180 °c, tampadas. desfie metade pro risoto e sirva o resto por cima. fim: cogumelos salteados a parte entram com o pato, depois manteiga e parmesao. texto de portugal: \"q.b.\" e \"quanto baste\", ou seja, a gosto."},{"id":"risoto-13","nome":"Risoto de carne-seca","cat":["Risoto"],"fonte":"Receitas de Pesos","url":"https://receitasdepesos.com.br/2026/08/28/risoto-de-carne-seca-tao-cremoso-que-eu-sirvo-direto-da-panela-anote-esta-receita-especial-para-o-almoco/","dif":2,"sal":"atenção","eq":["fg"],"prot":["Boi"],"html":"<ul><li><strong>Entra:<\/strong> 500 g de carne-seca dessalgada, cozida e desfiada · 1 tomate · ½ xícara de parmesão. A fonte usa 2 xícaras de arroz e 1,5 L de caldo, pra 6 porções.<\/li><li><strong>Dessalgar:<\/strong> 12 horas, trocando a água 3 vezes (a própria fonte manda).<\/li><li><strong>Refogado:<\/strong> a carne-seca com cebola e alho até dourar as bordas, depois o tomate. <strong>Metade desse refogado fica reservada<\/strong> e volta por cima no final.<\/li><li><strong>Sal:<\/strong> só no fim, provando. A fonte pede caldo com pouco sal; aqui, sem sal.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de carne-seca entra: 500 g de carne-seca dessalgada, cozida e desfiada · 1 tomate · ½ xicara de parmesao. a fonte usa 2 xicaras de arroz e 1,5 l de caldo, pra 6 porcoes. dessalgar: 12 horas, trocando a agua 3 vezes (a propria fonte manda). refogado: a carne-seca com cebola e alho ate dourar as bordas, depois o tomate. metade desse refogado fica reservada e volta por cima no final. sal: so no fim, provando. a fonte pede caldo com pouco sal; aqui, sem sal."},{"id":"risoto-14","nome":"Risoto de bacalhau na pressão","cat":["Risoto"],"fonte":"Panelinha","url":"https://panelinha.com.br/receita/risoto-de-bacalhau-com-tomate-na-pressao","dif":3,"sal":"atenção","eq":["fg","pr"],"prot":["Boi","Peixe"],"html":"<p><strong>Não é pra primeira vez:<\/strong> panela de pressão e dessalgue.<\/p><ul><li><strong>Entra:<\/strong> 500 g de bacalhau desfiado · alho-poró, salsão, cebola, alho · ½ xícara de vinho tinto · 1 lata de tomate pelado · 1½ xícara de água · 2 colheres (sopa) de manteiga. A fonte usa 1½ xícara de arroz, até 6 porções. <strong>Não leva caldo<\/strong>, só água.<\/li><li><strong>Como:<\/strong> o bacalhau entra cru com a água e o tomate, tudo na pressão <strong>3 minutos a partir do apito<\/strong>. Depois volta ao fogo 1 minuto, mexendo. Manteiga no fim.<\/li><li><strong>Dessalgue:<\/strong> a fonte usa bacalhau congelado e dá 2 banhos de 1 minuto. Na carne-seca (<a href=\"#\" class=\"goto\" data-goto=\"r:risoto-13\">risoto de carne-seca<\/a>) a fonte dessalga 12 horas; com bacalhau em posta, faça o mesmo.<\/li><\/ul>","nota":"Monte sobre a ficha do risoto base de parmesão.","busca":"risoto de bacalhau na pressao nao e pra primeira vez: panela de pressao e dessalgue. entra: 500 g de bacalhau desfiado · alho-poro, salsao, cebola, alho · ½ xicara de vinho tinto · 1 lata de tomate pelado · 1½ xicara de agua · 2 colheres (sopa) de manteiga. a fonte usa 1½ xicara de arroz, ate 6 porcoes. nao leva caldo , so agua. como: o bacalhau entra cru com a agua e o tomate, tudo na pressao 3 minutos a partir do apito . depois volta ao fogo 1 minuto, mexendo. manteiga no fim. dessalgue: a fonte usa bacalhau congelado e da 2 banhos de 1 minuto. na carne-seca ( risoto de carne-seca ) a fonte dessalga 12 horas; com bacalhau em posta, faca o mesmo."},{"id":"cardapio-1","nom
